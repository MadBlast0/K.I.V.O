[package]
name = "kivo-voice"
description = "Wake word, speaker verification, speech-to-text and text-to-speech provider traits and adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# whisper.cpp on the GPU (Vulkan): only the speech worker enables it (it needs the Vulkan SDK and
# CMake to build).
whisper-cpp = ["dep:whisper-rs"]

[dependencies]
kivo-platform.workspace = true
ort.workspace = true
# MIT/Unlicense; whisper.cpp is MIT.
whisper-rs = { version = "0.16.0", features = ["vulkan"], optional = true }
realfft.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
ureq.workspace = true
tungstenite.workspace = true

[lints]
workspace = true
