# KIVO fast-path commands, English (BRAINS §2, VOICE §9). Each command names the tool it runs and
# the phrasings that mean it. `{slot}` captures words; `{slot?}` may be left out. Slot kinds:
#   app     an installed app, fuzzy-matched against the live app index
#   window  an open window, matched by title or app
#   number  0–100 as digits or words ("fifty", "25%")
#   url     a web address ("youtube.com", "youtube dot com")
#   text    free text (a search query)
# Phrasings are matched after normalization: lower case, no punctuation, and polite fillers
# ("please", "can you", "hey kivo") removed. Earlier commands win ties.

[fillers]
leading = ["hey kivo", "okay kivo", "ok kivo", "kivo", "please", "can you", "could you", "would you", "will you", "i want to", "i'd like to", "go ahead and", "just"]
trailing = ["please", "for me", "now", "right now", "thanks", "thank you", "kivo"]

[[command]]
tool = "browser.open_url"
patterns = ["open {url}", "go to {url}", "visit {url}", "open the website {url}", "take me to {url}"]

[[command]]
tool = "browser.search"
patterns = [
  "search for {text}", "search the web for {text}", "search {text}", "google {text}",
  "look up {text}", "search online for {text}", "find {text} on the web",
]

[[command]]
tool = "apps.launch"
patterns = ["open {app}", "launch {app}", "start {app}", "run {app}", "open up {app}", "fire up {app}", "bring up {app}"]

[[command]]
tool = "apps.close"
patterns = ["close {app}", "quit {app}", "exit {app}", "kill {app}", "shut {app}"]

[[command]]
tool = "apps.restart"
patterns = ["restart {app}", "relaunch {app}", "reopen {app}", "reload {app}", "close and reopen {app}"]

[[command]]
tool = "windows.focus"
patterns = ["switch to {window}", "go to {window}", "show {window}", "focus {window}", "bring {window} to the front"]

[[command]]
tool = "windows.minimize"
patterns = ["minimize {window?}", "minimise {window?}", "minimize this window", "minimize the window", "hide this window"]

[[command]]
tool = "windows.maximize"
patterns = ["maximize {window?}", "maximise {window?}", "maximize this window", "make this window full screen", "make it bigger"]

[[command]]
tool = "windows.close"
patterns = ["close this window", "close the window", "close this", "close it", "close window"]

[[command]]
tool = "session.undo"
patterns = ["undo", "undo that", "undo it", "undo the last thing", "take that back", "revert that", "cancel that change"]

[[command]]
tool = "audio.mute"
patterns = ["mute", "mute the sound", "mute the volume", "mute audio", "mute the audio", "mute sound", "silence", "sound off", "turn the sound off"]

[[command]]
tool = "audio.unmute"
patterns = ["unmute", "unmute the sound", "unmute audio", "sound on", "turn the sound on", "turn the sound back on"]

[[command]]
tool = "audio.volume_set"
patterns = [
  "set the volume to {number}", "set volume to {number}", "volume to {number}", "volume {number}",
  "set the volume at {number}", "change the volume to {number}", "turn the volume to {number}",
]

[[command]]
tool = "audio.volume_up"
patterns = ["volume up", "turn it up", "turn the volume up", "turn up the volume", "louder", "increase the volume", "raise the volume"]

[[command]]
tool = "audio.volume_down"
patterns = ["volume down", "turn it down", "turn the volume down", "turn down the volume", "quieter", "lower the volume", "decrease the volume"]

[[command]]
tool = "audio.mic_mute"
patterns = ["mute the microphone", "mute my microphone", "mute the mic", "mute my mic", "turn off the microphone", "turn off my mic"]

[[command]]
tool = "audio.mic_unmute"
patterns = ["unmute the microphone", "unmute my microphone", "unmute the mic", "unmute my mic", "turn on the microphone", "turn on my mic"]

[[command]]
tool = "media.play_pause"
patterns = ["pause", "play", "resume", "pause the music", "play the music", "resume the music", "pause music", "play music", "pause the video", "play the video", "stop the music"]

[[command]]
tool = "media.next"
patterns = ["next", "next song", "next track", "skip", "skip this song", "skip the song", "skip track", "play the next song"]

[[command]]
tool = "media.previous"
patterns = ["previous", "previous song", "previous track", "go back a song", "last song", "play the previous song"]

[[command]]
tool = "media.now_playing"
patterns = ["what's playing", "what is playing", "what song is this", "what's this song", "what is this song", "which song is this"]

[[command]]
tool = "screen.screenshot"
patterns = [
  "take a screenshot", "screenshot", "take screenshot", "capture the screen", "grab the screen",
  "take a screen shot", "screen shot", "capture my screen", "take a picture of the screen",
]

[[command]]
tool = "screen.screenshot_window"
patterns = [
  "take a screenshot of this window", "screenshot this window", "screenshot the window",
  "capture this window", "take a screenshot of {window}", "screenshot {window}",
]

[[command]]
tool = "system.lock"
patterns = ["lock", "lock the computer", "lock my computer", "lock the pc", "lock my pc", "lock the screen", "lock windows"]

[[command]]
tool = "system.sleep"
patterns = ["go to sleep", "sleep", "put the computer to sleep", "put my pc to sleep", "sleep the computer"]

[[command]]
tool = "system.restart"
patterns = ["restart", "restart the computer", "restart my computer", "restart the pc", "restart my pc", "reboot", "reboot the computer"]

[[command]]
tool = "system.shutdown"
patterns = ["shut down", "shutdown", "shut down the computer", "shut down my computer", "turn off the computer", "turn off my pc", "power off", "shut down the pc"]

# M5: event tasks (BRAIN-07). "Tell me when …", "remind me …" and "watch …" become tasks with a
# watcher; the brain gets the same tools for phrasings these don't cover.
[[command]]
tool = "tasks.remind"
patterns = [
  "remind me in {number} minutes to {text}", "remind me to {text} in {number} minutes",
  "in {number} minutes remind me to {text}", "set a reminder in {number} minutes to {text}",
  "set a reminder for {number} minutes", "remind me in {number} minutes",
  "remind me in {number} minute to {text}", "remind me in {number} minute",
  "set a timer for {number} minutes", "timer for {number} minutes", "start a {number} minute timer",
]
args = { unit = "minutes" }

[[command]]
tool = "tasks.remind"
patterns = [
  "remind me in {number} hours to {text}", "remind me to {text} in {number} hours",
  "remind me in {number} hour to {text}", "remind me in {number} hours", "remind me in {number} hour",
]
args = { unit = "hours" }

[[command]]
tool = "tasks.watch"
patterns = [
  "tell me when the build finishes", "tell me when the build is done", "let me know when the build finishes",
  "let me know when the build is done", "notify me when the build finishes", "tell me when the build is finished",
  "tell me when the tests finish", "let me know when the tests are done", "tell me when the compile finishes",
  "tell me when it finishes building", "watch the build",
]
args = { kind = "build" }

[[command]]
tool = "tasks.watch"
patterns = [
  "tell me when the download finishes", "tell me when the download is done", "let me know when the download finishes",
  "let me know when my download is done", "tell me when my download finishes", "notify me when the download is done",
]
args = { kind = "download" }

[[command]]
tool = "tasks.watch"
patterns = ["tell me when {app} closes", "let me know when {app} closes", "tell me when {app} is closed", "tell me when i close {app}"]
args = { kind = "window", event = "closed" }

[[command]]
tool = "tasks.watch"
patterns = ["tell me when {app} opens", "let me know when {app} opens", "tell me when {app} starts", "tell me when {app} is open"]
args = { kind = "window", event = "opened" }

[[command]]
tool = "tasks.watch"
patterns = ["tell me when {app} finishes", "let me know when {app} finishes", "tell me when {app} is done", "tell me when {app} exits"]
args = { kind = "process" }

# "What did I miss?" (UX-40) and "What can I say?" (UX-44).
[[command]]
tool = "session.missed"
patterns = ["what did i miss", "what did i miss while i was away", "anything new", "catch me up", "did i miss anything", "whats new"]

# Every Island button by voice (UX-55): Retry, "That's not what I meant", Turn it on, Open.
[[command]]
tool = "session.retry"
patterns = ["try again", "try that again", "do that again", "retry", "one more time"]

[[command]]
tool = "session.misroute"
patterns = ["thats not what i meant", "that is not what i meant", "not what i meant", "wrong answer", "you got that wrong"]

[[command]]
tool = "session.enable"
patterns = ["turn it on", "turn that on", "switch it on", "enable it", "allow that"]

[[command]]
tool = "session.open"
patterns = ["open my tasks", "show my tasks", "open tasks", "show tasks", "show me my tasks"]
args = { page = "tasks" }

[[command]]
tool = "session.open"
patterns = ["open my routines", "show my routines", "open routines"]
args = { page = "routines" }

[[command]]
tool = "session.open"
patterns = ["open the control center", "open control center", "show the control center", "open kivo", "show kivo"]
args = { page = "home" }

# Product modes (PLAN-06): how KIVO behaves right now; Normal puts the user's own settings back.
[[command]]
tool = "session.mode"
patterns = [
  "normal mode", "switch to normal mode", "back to normal", "go back to normal", "normal mode on",
  "turn off the mode", "leave this mode", "exit this mode", "turn off private mode",
  "private mode off", "exit private mode", "leave private mode", "stop private mode",
  "turn off offline mode", "offline mode off", "exit offline mode", "leave offline mode",
  "stop offline mode", "turn off battery mode", "battery mode off", "exit battery mode",
  "leave battery mode", "stop battery mode", "turn off performance mode", "performance mode off",
  "exit performance mode", "leave performance mode", "stop performance mode",
  "turn off gaming mode", "gaming mode off", "exit gaming mode", "leave gaming mode",
  "stop gaming mode", "turn off presentation mode", "presentation mode off",
  "exit presentation mode", "leave presentation mode", "stop presentation mode",
]
args = { mode = "normal" }

[[command]]
