# "Where is the Export button?" (UX-39, plan §141): KIVO points at it and says where it is.
[[command]]
tool = "uia.point_at"
patterns = [
  "where is the {text} button", "where's the {text} button", "where is the {text} menu",
  "where's the {text} menu", "show me the {text} button", "point to the {text} button",
  "point at the {text} button", "where do i click {text}", "find the {text} button",
]

# "Save what you just did as a routine" (ROUT-13): the last request's actions become a draft.
[[command]]
tool = "session.saveRoutine"
patterns = [
  "save that as a routine", "save what you just did as a routine", "make that a routine",
  "turn that into a routine", "save this as a routine", "make a routine from that",
]

[[command]]
tool = "session.help"
patterns = ["what can i say", "what can i say here", "help", "what can you do here", "what can i ask", "show me what i can say"]

# The clock (invariant 3: a deterministic answer needs no AI).
[[command]]
tool = "session.time"
patterns = ["what time is it", "what's the time", "what is the time", "tell me the time", "what time is it now", "the time"]

[[command]]
tool = "session.date"
patterns = [
  "what's the date", "what is the date", "what's today's date", "what is today's date", "what day is it",
  "what day is it today", "what's the date today", "tell me the date",
]

# Memory (MEM-05): the user asks KIVO to remember or forget something, or what it remembers.
[[command]]
tool = "memory.add"
patterns = ["remember that {text}", "please remember that {text}", "please remember {text}", "remember {text}", "dont forget that {text}", "keep in mind that {text}"]

[[command]]
tool = "memory.forget"
patterns = ["forget that {text}", "please forget that {text}", "stop remembering that {text}"]

[[command]]
tool = "memory.search"
patterns = ["what do you remember about {text}", "do you remember anything about {text}"]

[[command]]
tool = "session.open"
patterns = ["open my memory", "show my memory", "open memory", "show me what you remember"]
args = { page = "memory" }
