patterns = [
  "private mode", "switch to private mode", "turn on private mode", "private mode on",
  "go into private mode", "enter private mode", "use private mode", "start private mode",
]
args = { mode = "private" }

[[command]]
tool = "session.mode"
patterns = [
  "offline mode", "switch to offline mode", "turn on offline mode", "offline mode on",
  "go into offline mode", "enter offline mode", "use offline mode", "start offline mode",
]
args = { mode = "offline" }

[[command]]
