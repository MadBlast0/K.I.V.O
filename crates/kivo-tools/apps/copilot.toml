# Microsoft Copilot (DISC-06), found by its name in the installed apps.
id = "copilot"
name = "Microsoft Copilot"
aliases = ["Copilot"]
desktop_ai = true
prefer = ["uia"]
examples = ["Open Copilot"]

# Prompting it through UI Automation (CONV-16). Written from the app's accessible names; not yet
# checked on a real install (KIVO's tests never act on the owner's apps), so the flow falls back
# ("I've put the prompt in; press Enter when ready", or the clipboard) when they don't match.
[ai]
version = "Microsoft Copilot 1.25 (2026)"
verified = false
composer = { role = "Edit", name = "Message Copilot" }
send = { role = "Button", name = "Submit message" }
