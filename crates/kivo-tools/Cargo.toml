[package]
name = "kivo-tools"
description = "Tool registry, tool schemas and built-in tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kivo-core.workspace = true
kivo-platform.workspace = true
kivo-security = { path = "../kivo-security" }
jiff = "0.2"
png = "0.18.1"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
kivo-testkit = { path = "../kivo-testkit" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true
