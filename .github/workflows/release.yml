name: Release

# Runs only when a version tag is pushed (RELEASE.md §2; owner decision: no workflows on pushes,
# pull requests or schedules). vX.Y.Z → Stable, vX.Y.Z-beta.N → Beta, vX.Y.Z-exp.N → Experimental.
#
#   check      the tag is on main (REL-11) and which channel it is
#   windows    x64 and ARM64: notices, sidecars, installers (signed and with updater signatures
#              once the owner has set the keys), size check, signature check, smoke test
#   other      macOS and Linux, built but never published (REL-07; kept 14 days)
#   sbom       CycloneDX SBOMs (Rust, npm) and THIRD_PARTY_NOTICES (REL-10, DIST-16)
#   draft      a draft GitHub Release with the installers, checksums, SBOMs, notices and the
#              channel's update manifest
#   publish    after the owner approves the `production` environment: publishes the release and
#              the channel manifest the updater reads (DIST-07), and removes Experimental
#              releases older than 14 days (REL-08)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag and channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # REL-11: release jobs only for tags on main.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: channel
        name: Channel
        run: echo "channel=$(node -e "import('./scripts/update-manifest.mjs').then(m => console.log(m.channelOf(process.argv[1])))" "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, arch: x64 }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    # The signing secrets live in the `release` environment (REL-11).
    environment: release
    env:
      TARGET: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_DLIB: ${{ secrets.AZURE_SIGNING_DLIB }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_CERT_SHA1: ${{ secrets.SIGNING_CERT_SHA1 }}
      # The publisher an update's installer must be signed by (SEC-32), compiled into the app.
      KIVO_SIGNING_PUBLISHER: ${{ vars.KIVO_SIGNING_PUBLISHER }}
      # KIVO's own OAuth clients (INT-05), compiled into the runtime when the owner has them.
      KIVO_GOOGLE_CLIENT_ID: ${{ vars.KIVO_GOOGLE_CLIENT_ID }}
      KIVO_MICROSOFT_CLIENT_ID: ${{ vars.KIVO_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # whisper.cpp's graphics-card backend (kivo-infer on Windows x64 only) builds against the
      # Vulkan SDK: LunarG's installer, pinned and checked.
      - name: Vulkan SDK
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = '1.4.357.0'
          $exe = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($sha -ne '81F474711E9042F4CD22B31B2F7A8870DB2E428B21586FB43DD80150BE97310D') { throw "Vulkan SDK checksum: $sha" }
          & $exe --root "C:\VulkanSDK\$version" --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          # libclang for whisper-rs's bindings: the runner image ships LLVM.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # DIST-16: THIRD_PARTY_NOTICES.txt, bundled beside KIVO.exe and shown in About.
      - name: Third-party notices
        run: pnpm licenses:gen

      - name: Release configuration
        shell: pwsh
        run: |
          $configs = @('src-tauri/tauri.bundle.conf.json')
          # DIST-07: updater signatures, and the public key compiled into the app, once the owner
          # has made the minisign key (`pnpm tauri signer generate`, public half committed).
          $pub = 'apps/kivo-app/src-tauri/updater.pub'
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and (Test-Path $pub)) {
            $configs += 'src-tauri/tauri.updater.conf.json'
            "KIVO_UPDATER_PUBKEY=$((Get-Content $pub -Raw).Trim())" >> $env:GITHUB_ENV
          } else {
            Write-Warning 'No updater key yet: this build cannot update itself.'
          }
          # DIST-11 / REL-09: Authenticode through scripts/sign.ps1 for every executable and installer.
          if ($env:AZURE_SIGNING_ENDPOINT -or $env:SIGNING_CERT_SHA1) {
            $script = (Resolve-Path scripts/sign.ps1).Path
            @{ bundle = @{ windows = @{ signCommand = "pwsh -NoProfile -File `"$script`" %1" } } } |
              ConvertTo-Json -Depth 5 | Set-Content apps/kivo-app/src-tauri/tauri.sign.conf.json -Encoding utf8NoBOM
            $configs += 'src-tauri/tauri.sign.conf.json'
            'KIVO_SIGNED=1' >> $env:GITHUB_ENV
          } else {
            Write-Warning 'No signing identity yet: this build is unsigned.'
          }
          "TAURI_CONFIGS=$(($configs | ForEach-Object { "--config $_" }) -join ' ')" >> $env:GITHUB_ENV

      # RELEASE.md §2 step 3: kivo-runtime and kivo-infer into src-tauri/binaries/<name>-<triple>,
      # after the configuration above so the runtime is built with the updater key and publisher.
      - name: Build the sidecars
        run: node scripts/sidecars.mjs --target ${{ env.TARGET }}

      # Build only: nothing is uploaded before the checks below pass.
      - name: Build the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/kivo-app
          tauriScript: pnpm tauri
          args: --target ${{ env.TARGET }} ${{ env.TAURI_CONFIGS }}
          uploadUpdaterJson: false

      # DIST-03: the installer stays under 40 MB (BENCHMARKS §3).
      - name: Installer size
        shell: pwsh
        run: |
          $limit = 40MB
          Get-ChildItem "target/$env:TARGET/release/bundle/nsis/*-setup.exe", "target/$env:TARGET/release/bundle/msi/*.msi" | ForEach-Object {
            '{0}: {1:N1} MB' -f $_.Name, ($_.Length / 1MB)
            if ($_.Length -gt $limit) { throw "$($_.Name) is over 40 MB" }
          }

      # DIST-11: every executable and installer carries a valid signature.
      - name: Signatures
        if: env.KIVO_SIGNED == '1'
        shell: pwsh
        run: |
          $release = "target/$env:TARGET/release"
          $files = @("$release/KIVO.exe") +
            (Get-ChildItem "apps/kivo-app/src-tauri/binaries/*.exe").FullName +
            (Get-ChildItem "$release/bundle/nsis/*-setup.exe", "$release/bundle/msi/*.msi").FullName
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            '{0}: {1} ({2})' -f (Split-Path $f -Leaf), $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed" }
          }

      - name: Smoke test (install, launch, IPC health, upgrade, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "target/$env:TARGET/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          ./scripts/smoke-install.ps1 -Installer $setup.FullName

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem "target/$env:TARGET/release/bundle/nsis/*-setup.exe*", "target/$env:TARGET/release/bundle/msi/*.msi*" |
            Copy-Item -Destination dist
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  # REL-07: macOS and Linux are built so portability regressions show, but never published until
  # their ports land (RELEASE.md §3). Their failures don't stop a Windows release.
  other:
    name: ${{ matrix.name }} (not published)
    needs: check
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS universal, runner: macos-latest, target: universal-apple-darwin }
          - { name: Linux x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev rpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:gen
      - run: node scripts/sidecars.mjs --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: apps/kivo-app
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
          uploadUpdaterJson: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpublished-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          retention-days: 14

  # REL-10 and DIST-16: what the release is made of, uploaded with it.
  sbom:
    name: SBOM and notices
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          mkdir -p sbom
          for p in kivo-runtime kivo-infer kivo-app; do
            dir=$(cargo metadata --format-version 1 --no-deps | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);console.log(require('path').dirname(m.packages.find(x=>x.name==='$p').manifest_path))})")
            (cd "$dir" && cargo cyclonedx --format json --override-filename "$p.cdx")
            mv "$dir/$p.cdx.json" "sbom/$p.cdx.json"
          done
      - name: npm SBOM
        run: npx --yes @cyclonedx/cdxgen@11 -t pnpm --required-only -o sbom/kivo-app-npm.cdx.json apps/kivo-app
      - name: Notices
        run: |
          pnpm licenses:gen
          cp apps/kivo-app/src-tauri/THIRD_PARTY_NOTICES.txt sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 14

  draft:
    name: Draft release
    needs: [check, windows, sbom]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.check.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Assemble
        run: |
          mkdir -p release
          cp artifacts/windows-*/* artifacts/sbom/* release/
          # DIST-07: the channel's manifest, from the updater signatures (none until the key is set).
          if ls release/*.sig >/dev/null 2>&1; then
            node scripts/update-manifest.mjs --tag "$GITHUB_REF_NAME" --dir release --out "release/$CHANNEL.json"
          fi
          (cd release && sha256sum -- * | grep -v 'SHA256SUMS' > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Draft
        run: |
          flags=(--draft --verify-tag --generate-notes --title "KIVO ${GITHUB_REF_NAME#v}")
          if [ "$CHANNEL" != stable ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*

  publish:
    name: Publish (${{ needs.check.outputs.channel }})
    needs: [check, draft]
    runs-on: ubuntu-latest
    # REL-11: the owner approves every publish (the `production` environment's reviewers).
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.check.outputs.channel }}
    steps:
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Publish the channel's update manifest
        run: |
          if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$CHANNEL.json"; then
            gh release view updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
              gh release create updates --repo "$GITHUB_REPOSITORY" --latest=false --title "Update manifests" \
                --notes "The manifests KIVO's updater reads: stable.json, beta.json, experimental.json."
            gh release upload updates "$CHANNEL.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::warning::No $CHANNEL.json (no updater key yet): installed copies won't see this release."
          fi
      # REL-08: Experimental releases live for 14 days.
      - name: Remove old Experimental releases
        run: |
          cutoff=$(date -u -d '14 days ago' +%s)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '.[] | select(.tagName | test("-exp\\.")) | "\(.tagName) \(.createdAt)"' |
          while read -r tag created; do
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
