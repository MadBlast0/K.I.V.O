name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Crates with no OS-specific code: built and tested on Linux and macOS too, so the
  # portability promise (ARCHITECTURE §7) is enforced from M0.
  PORTABLE_CRATES: >-
    -p kivo-core -p kivo-ipc -p kivo-platform -p kivo-audio -p kivo-voice -p kivo-intent
    -p kivo-brain -p kivo-tools -p kivo-security -p kivo-mcp -p kivo-store -p kivo-testkit

jobs:
  commit-messages:
    name: Conventional Commit messages
    # Direct pushes to main skip the PR-title check, so the pushed commits are checked here.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check commit subjects
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          bad=$(jq -r '.commits[] | select(.author.name != "dependabot[bot]") | .message | split("\n")[0]' "$GITHUB_EVENT_PATH" | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "These commit subjects are not Conventional Commits (RELEASE.md §1):"
            echo "$bad"
            exit 1
          fi

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  rust-portable:
    name: Rust (${{ matrix.os }}, portable crates)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy $PORTABLE_CRATES --all-targets --locked
      - name: Test
        run: cargo test $PORTABLE_CRATES --locked

  cargo-deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  ui:
    name: UI and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm --filter kivo-app build
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Roadmap in sync with the specs
        run: |
          pnpm docs:sync
          git diff --exit-code -- docs/ROADMAP.md
