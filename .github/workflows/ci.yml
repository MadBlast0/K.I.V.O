name: CI

# Runs only for releases: when a version tag is pushed (RELEASE.md §2), or by hand from the
# Actions tab. Day-to-day pushes to main run nothing; check locally before pushing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Crates with no OS-specific code: built and tested on Linux and macOS too, so the
  # portability promise (ARCHITECTURE §7) is enforced from M0.
  PORTABLE_CRATES: >-
    -p kivo-core -p kivo-ipc -p kivo-platform -p kivo-audio -p kivo-voice -p kivo-intent
    -p kivo-brain -p kivo-tools -p kivo-security -p kivo-mcp -p kivo-store -p kivo-testkit

jobs:
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # TOOL-39: the UI Automation journey against the dummy app (testenv/app), named so a
      # failure shows here. It only acts on its own window and writes only into a temp folder;
      # nothing in the suite is destructive, so no Windows Sandbox step is needed yet.
      - name: UI Automation journey (dummy app)
        run: cargo test -p kivo-platform-windows --test uia_testenv --locked
      # TOOL-40: the security suite v1 (injection pages and documents, shell injection strings,
      # path traversal, permission-bypass attempts).
      - name: Security suite
        run: |
          cargo test -p kivo-tools --lib security_suite --locked
          cargo test -p kivo-runtime --test security_suite --locked
      - name: Generated IPC types are up to date
        run: cargo test -p kivo-ipc --features ts --test ts_bindings --locked
      # BENCHMARKS §4 smoke subset: the IPC round trip over the real pipe (the state-machine and
      # cancellation tests run above; the intent-router latency joins with the router, M1).
      - name: Smoke benchmarks
        run: cargo run --locked --release -p kivo-bench -- ipc --runs 5 --warmup 1 --no-save

  rust-portable:
    name: Rust (${{ matrix.os }}, portable crates)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy $PORTABLE_CRATES --all-targets --locked
      - name: Test
        run: cargo test $PORTABLE_CRATES --locked

  cargo-deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  ui:
    name: UI and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm --filter kivo-app build
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Roadmap in sync with the specs
        run: |
          pnpm docs:sync
          git diff --exit-code -- docs/ROADMAP.md
