name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: textarea
    id: alt
    attributes: { label: Alternatives considered }
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked docs/DECISIONS.md and the roadmap for an existing decision on this.
