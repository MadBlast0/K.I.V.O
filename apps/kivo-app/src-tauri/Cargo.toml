[package]
name = "kivo-app"
description = "KIVO desktop UI (Tauri v2 + WebView2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "kivo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The app's only link to KIVO is IPC (ARCHITECTURE §8): no store, secrets or tools crates here.
kivo-core.workspace = true
kivo-ipc.workspace = true
kivo-platform.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util.workspace = true

[lints]
workspace = true
