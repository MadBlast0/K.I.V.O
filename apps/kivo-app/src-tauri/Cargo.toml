[package]
name = "kivo-app"
description = "KIVO desktop UI (Tauri v2 + WebView2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "kivo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The app's only link to KIVO is IPC (ARCHITECTURE §8): no store, secrets or tools crates here.
kivo-core.workspace = true
kivo-ipc.workspace = true
kivo-platform.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util.workspace = true

# A hidden webview's memory target and suspension (memory.rs, BENCH-12). Same versions as
# Tauri's own WebView2 bindings.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# UI Automation notifications for screen readers (announce.rs, UX-53).
# The taskbar jump list (jumplist.rs, UX-58).
windows = { version = "0.61", features = [
    "Win32_UI_Accessibility",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[lints]
workspace = true
