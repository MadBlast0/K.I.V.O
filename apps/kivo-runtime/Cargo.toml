[package]
name = "kivo-runtime"
description = "The KIVO runtime: the always-on core process (tray, audio, wake word, routing, tools, permissions, store)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ed25519-dalek.workspace = true
lewton.workspace = true
kivo-audio = { path = "../../crates/kivo-audio" }
kivo-brain = { path = "../../crates/kivo-brain" }
kivo-core.workspace = true
jiff.workspace = true
kivo-intent = { path = "../../crates/kivo-intent" }
kivo-ipc.workspace = true
kivo-platform.workspace = true
kivo-security = { path = "../../crates/kivo-security" }
kivo-store.workspace = true
kivo-mcp.workspace = true
kivo-memory.workspace = true
rmcp.workspace = true
# The test rig's "browser" for connector sign-ins.
reqwest.workspace = true
url = "2"
# Skill imports from a .zip (CONV-32); MIT.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
kivo-tools = { path = "../../crates/kivo-tools" }
kivo-voice = { path = "../../crates/kivo-voice" }
# The fakes behind `scripted` (end-to-end tests and the `kivo-e2e` benchmark journeys); the
# runtime binary itself never uses them.
kivo-testkit = { path = "../../crates/kivo-testkit" }
dirs.workspace = true
notify.workspace = true
serde.workspace = true
uuid.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util", "io-std", "net"] }
tokio-util = { workspace = true, features = ["codec"] }
futures-util.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
base64.workspace = true
sha2.workspace = true
minisign-verify.workspace = true
getrandom.workspace = true
# KIVO's own browser profile over the DevTools protocol (TOOL-25); never downloads a browser.
chromiumoxide = { version = "0.9.1", default-features = false }

[target.'cfg(windows)'.dependencies]
kivo-platform-windows = { path = "../../crates/kivo-platform-windows" }

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints]
workspace = true
