[package]
name = "kivo-runtime"
description = "The KIVO runtime: the always-on core process (tray, audio, wake word, routing, tools, permissions, store)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kivo-core.workspace = true
kivo-ipc.workspace = true
kivo-platform.workspace = true
kivo-store.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
kivo-platform-windows = { path = "../../crates/kivo-platform-windows" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
