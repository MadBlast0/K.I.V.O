[package]
name = "kivo-infer"
description = "Inference worker: runs speech-to-text, text-to-speech and embedding models out of process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kivo-ipc.workspace = true
kivo-platform.workspace = true
kivo-voice = { path = "../../crates/kivo-voice" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
kivo-platform-windows = { path = "../../crates/kivo-platform-windows" }

# whisper.cpp on the graphics card (DECISIONS "Local models on the GPU first", VOICE-50): Vulkan on
# Windows, whose build needs CMake and the Vulkan SDK's headers, glslc and loader library (`pnpm
# build-tools`, run by `pnpm dev` and `pnpm build`; installed KIVO needs only the graphics driver),
# and Metal on macOS. NVIDIA's CUDA build is `kivo-infer-cuda`, from the same source.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
kivo-voice = { path = "../../crates/kivo-voice", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
kivo-voice = { path = "../../crates/kivo-voice", features = ["metal"] }

[lints]
workspace = true
