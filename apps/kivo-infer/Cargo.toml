[package]
name = "kivo-infer"
description = "Inference worker: runs speech-to-text, text-to-speech and embedding models out of process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kivo-ipc.workspace = true
kivo-platform.workspace = true
kivo-voice = { path = "../../crates/kivo-voice" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
kivo-platform-windows = { path = "../../crates/kivo-platform-windows" }

[lints]
workspace = true
