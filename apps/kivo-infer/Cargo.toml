[package]
name = "kivo-infer"
description = "Inference worker: runs speech-to-text, text-to-speech and embedding models out of process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kivo-ipc.workspace = true
kivo-platform.workspace = true
kivo-voice = { path = "../../crates/kivo-voice" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
kivo-platform-windows = { path = "../../crates/kivo-platform-windows" }

# whisper.cpp on the graphics card through Vulkan (DECISIONS "Local models on the GPU first").
# Building it needs CMake and the Vulkan SDK's headers, glslc and loader library: `pnpm build-tools`
# (run by `pnpm dev` and `pnpm build`). Installed KIVO needs only the graphics driver.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
kivo-voice = { path = "../../crates/kivo-voice", features = ["whisper-cpp"] }

[lints]
workspace = true
