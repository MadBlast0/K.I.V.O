[package]
name = "kivo-testenv-app"
description = "The safe test ground's dummy app (TOOLS_AND_CONTROL §10): known AutomationIds for UIA tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kivo-test-app"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
