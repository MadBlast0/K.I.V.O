[workspace]
resolver = "3"
members = ["crates/*", "apps/kivo-runtime", "apps/kivo-infer", "apps/kivo-bench", "apps/kivo-app/src-tauri", "testenv/app", "testenv/mcp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Shared versions: crates use `name.workspace = true`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
zeroize = "1.9.0"
toml = "1.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
dirs = "7.0.0"
# Folder and download watchers (TOOL-28): ReadDirectoryChangesW on Windows.
notify = { version = "8.2.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
regex = "1.13.1"
tempfile = "3.27.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
bytes = "1.12.1"
getrandom = "0.4.3"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
windows = "0.62.2"
# ONNX Runtime (MIT) for the speech models: Silero VAD in the runtime, STT/TTS in kivo-infer.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "api-22"] }
base64 = "0.22"
rubato = "5.0"
realfft = "3.5"
# WebRTC AEC3 in pure Rust (BSD-3-Clause): echo cancellation (VOICE-30).
sonora = "0.2"
# Unicode normalization (MIT/Apache-2.0): Supertonic's text preparation.
unicode-normalization = "0.1"
# Model archives (.tar.bz2, as sherpa-onnx publishes its keyword-spotting models).
tar = "0.4"
bzip2 = "0.6"
ringbuf = "0.5"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["native-tls", "gzip"] }
# Async HTTP with streaming bodies for the brain adapters (SSE), Windows TLS via schannel.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json", "http2", "system-proxy"] }
# MCP (TOOLS_AND_CONTROL §9, TOOL-34): the official Rust SDK, Apache-2.0. The client (stdio child
# processes and Streamable HTTP), KIVO's own server for agents, and MCP authorization (OAuth 2.1 +
# PKCE with dynamic client registration) for remote connectors.
rmcp = { version = "3.4.0", default-features = false, features = [
  "client",
  "server",
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client-reqwest",
  "reqwest-native-tls",
  "auth",
] }
kivo-mcp = { path = "crates/kivo-mcp" }
async-trait = "0.1"
# UI Automation (Apache-2.0, checked in M0): the UIA thread and tools (TOOL-19).
uiautomation = { version = "0.25.1", default-features = false, features = ["process", "control", "event", "pattern", "input"] }
kivo-core = { path = "crates/kivo-core" }
kivo-platform = { path = "crates/kivo-platform" }
kivo-ipc = { path = "crates/kivo-ipc" }
kivo-store = { path = "crates/kivo-store" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dev and test builds stay small on disk: every integration test links its own copy of the
# runtime, and full debug info for the `windows` and ONNX crates made `target/` grow into the
# hundreds of GB. Line tables keep panics' backtraces readable; incremental caches aren't kept.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
