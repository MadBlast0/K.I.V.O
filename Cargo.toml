[workspace]
resolver = "3"
members = ["crates/*", "apps/kivo-runtime", "apps/kivo-infer", "apps/kivo-bench", "apps/kivo-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
