[workspace]
resolver = "3"
members = ["crates/*", "apps/kivo-runtime", "apps/kivo-infer", "apps/kivo-bench", "apps/kivo-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Shared versions: crates use `name.workspace = true`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
zeroize = "1.9.0"
toml = "1.1.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
dirs = "7.0.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
regex = "1.13.1"
tempfile = "3.27.0"
kivo-core = { path = "crates/kivo-core" }
kivo-platform = { path = "crates/kivo-platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
