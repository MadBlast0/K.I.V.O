<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIVO App Mockup</title>
<style>
/* ════════════════════════════ KIVO · Island theme · v3 ════════════════════════════ */
:root{
  --sys:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",-apple-system,system-ui,sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",-apple-system,system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --spring:cubic-bezier(.32,1.28,.54,1); --out:cubic-bezier(.2,.8,.2,1);
  --r-s:6px; --r-m:10px; --r-l:14px;
  --row:44px; --gap:12px;
  --isl:#000; --isl-fg:#fff; --isl-2:rgba(255,255,255,.62); --isl-3:rgba(255,255,255,.14);
}
[data-theme="light"]{
  --page:#E8E7E3; --win:#FBFBFA; --side:#F2F2F0; --group:#FFFFFF; --fill:rgba(0,0,0,.045); --fill-2:rgba(0,0,0,.075);
  --sep:rgba(0,0,0,.07); --border:rgba(0,0,0,.09); --text:#1D1D1F; --text-2:#6E6E73; --text-3:#9C9CA1;
  --ink:#1D1D1F; --ink-fg:#FFFFFF; --green:#1F9D55; --orange:#C77C02; --red:#D93F3F;
  --shadow:0 1px 1px rgba(0,0,0,.04),0 8px 28px -14px rgba(0,0,0,.22); --win-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 70px -30px rgba(0,0,0,.35);
}
[data-theme="dark"]{
  --page:#0D0D0D; --win:#1B1B1C; --side:#222223; --group:#262628; --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11);
  --sep:rgba(255,255,255,.07); --border:rgba(255,255,255,.09); --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#6E6E73;
  --ink:#F5F5F7; --ink-fg:#1D1D1F; --green:#32D74B; --orange:#FF9F0A; --red:#FF5147;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.7); --win-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 70px -30px rgba(0,0,0,.8);
}
[data-accent="blue"]{--acc:#0A6CFF}[data-theme="dark"][data-accent="blue"]{--acc:#3B8BFF}
[data-accent="violet"]{--acc:#7C5CFF}[data-theme="dark"][data-accent="violet"]{--acc:#A38BFF}
[data-accent="teal"]{--acc:#0E9494}[data-theme="dark"][data-accent="teal"]{--acc:#40C8C8}
[data-accent="green"]{--acc:#1F9D55}[data-theme="dark"][data-accent="green"]{--acc:#32D74B}
[data-accent="amber"]{--acc:#C98300}[data-theme="dark"][data-accent="amber"]{--acc:#FFB020}
[data-accent="coral"]{--acc:#E5533D}[data-theme="dark"][data-accent="coral"]{--acc:#FF7A5C}
[data-accent="graphite"]{--acc:#6E6E73}[data-theme="dark"][data-accent="graphite"]{--acc:#AEAEB2}
:root{--acc-soft:color-mix(in srgb,var(--acc) 12%,transparent)}
[data-textsize="large"] body{font-size:14.5px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font-family:var(--sys);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* ── Motion ── (production: Motion for React; same timings) */
:root{--t-fast:.15s;--t-base:.25s;--t-slow:.4s}
@keyframes kIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes kPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes kDrop{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kFwd{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes kBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes kSub{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes kBreathe{50%{transform:scale(1.06);filter:brightness(1.15)}}
.anim-in > *{animation:kIn .34s var(--out) both;animation-delay:calc(var(--i,0) * 30ms)}
.btn,.select,.ctl .c,.tags button,.scope button{transition:background var(--t-fast),color var(--t-fast),opacity var(--t-fast),transform .12s var(--out),box-shadow var(--t-fast)}
.btn:active,.select:active,.ctl .c:active{transform:scale(.97)}
.seg button{transition:background var(--t-base),color var(--t-base),box-shadow var(--t-base)}
.option{transition:box-shadow var(--t-base),transform .12s var(--out)}.option:active{transform:scale(.995)}
.rad,.chk i{transition:background var(--t-base)}.rad::after,.chk.on i::after{animation:kPop .2s var(--spring)}
.li.click,.side a,.threads a,.tree a,.wmenu .mi,.xmenu .mi,.jump .mi,.palette .pi{transition:background var(--t-fast),color var(--t-fast)}
.scrim.on{animation:kFade .2s var(--out)}
.scrim.on .modal{animation:kPop .3s var(--spring) both}
.scrim.on .palette{animation:kDrop .32s var(--spring) both}
.side-sheet .sb > *{animation:kIn .3s var(--out) both}
.wmenu,.xmenu,.jump,.hello,.sheetwin,.wtoast,.ttip{animation:kPop .28s var(--out) both;transform-origin:top left}
.wmenu .subm{animation:kSub .28s .12s var(--out) both}
.ob .col.fwd{animation:kFwd .36s var(--out) both}.ob .col.back{animation:kBack .36s var(--out) both}
.ob .welcome > *{animation:kIn .6s var(--out) both}.ob .welcome > *:nth-child(2){animation-delay:.12s}.ob .welcome > *:nth-child(3){animation-delay:.2s}.ob .welcome > *:nth-child(4){animation-delay:.28s}
.home .big .orb{animation:kBreathe 4.5s ease-in-out infinite}
.sf{opacity:0;transform:translateY(12px);transition:opacity .5s var(--out),transform .5s var(--out)}
.sf.shown{opacity:1;transform:none}
.ptabs{position:relative}
.ptabs button[aria-selected="true"]{border-bottom-color:transparent}
.ptabs .ind{position:absolute;bottom:0;height:2px;border-radius:2px;background:var(--ink);transition:left .38s var(--spring),width .38s var(--spring)}
.tog::after{will-change:transform}
@media (prefers-reduced-motion: reduce){*{transition-duration:0s!important;animation:none!important}.sf{opacity:1;transform:none}}

/* ── Viewer chrome (not part of the product) ── */
.viewer{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--page) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--sep)}
.vin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.vb{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:14px;margin-right:auto}
.vb small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--text-3)}
.mark{width:22px;height:22px;border-radius:50%;background:#000;display:grid;place-items:center;flex:none}
.mark::after{content:"";width:40%;height:40%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#9AD3FF 40%,#3A6DFF 80%)}
.vtabs{display:flex;gap:2px;background:var(--fill);padding:3px;border-radius:9px}
.vtabs button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--text-2);font-weight:500;font-size:12.5px}
.vtabs button[aria-pressed="true"]{background:var(--group);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.vopts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.vopts .grp{display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:5px}
.dots button{width:16px;height:16px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 1px var(--border) inset}
.dots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--page),0 0 0 3.5px var(--text)}
.page{max-width:1320px;margin:0 auto;padding:22px 16px 90px}
.intro{margin-bottom:16px}
.intro .eb{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-3)}
.intro h1{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.015em;margin:3px 0 0}
.intro p{margin:4px 0 0;color:var(--text-2);max-width:780px}

/* ════════ Controls ════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;border:0;background:var(--fill);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,opacity .15s}
.btn:hover{background:var(--fill-2)}
.btn.pri{background:var(--ink);color:var(--ink-fg)}
.btn.pri:hover{opacity:.88}
.btn.plain{background:transparent;color:var(--text-2)}.btn.plain:hover{background:var(--fill);color:var(--text)}
.btn.link{background:transparent;color:var(--acc);padding:0 4px}
.btn.destr{color:var(--red)}
.btn.stop{background:var(--red);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:12.5px}
.btn.ic{width:30px;padding:0}.btn.sm.ic{width:26px}
.btn[disabled]{opacity:.45;cursor:default}
.tog{width:38px;height:22px;border-radius:999px;border:0;background:var(--fill-2);position:relative;flex:none;padding:0;transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .28s var(--spring)}
.tog[aria-checked="true"]{background:var(--acc)}
.tog[aria-checked="true"]::after{transform:translateX(16px)}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:1px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:24px;padding:0 10px;border-radius:6px;color:var(--text-2);font-weight:500;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--group);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
[data-theme="dark"] .seg button[aria-pressed="true"]{background:#48484A}
.field{height:30px;border-radius:8px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--text-3);min-width:0}
.field input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--text)}
.field:focus-within{box-shadow:0 0 0 3px var(--acc-soft),0 0 0 1px var(--acc) inset}
.select{height:28px;border-radius:7px;background:var(--fill);display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 10px;font-size:13px;white-space:nowrap;cursor:pointer}
.select .i:last-child{width:12px;height:12px;transform:rotate(90deg);color:var(--text-3)}
.kbd{font-family:var(--sys);font-size:11px;font-weight:500;border-radius:5px;padding:1px 6px;background:var(--fill);color:var(--text-2);box-shadow:0 -1px 0 var(--border) inset;white-space:nowrap}
.keys{display:inline-flex;gap:3px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);white-space:nowrap}
.tag .d{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.tag.g .d{background:var(--green)}.tag.o .d{background:var(--orange)}.tag.r .d{background:var(--red)}.tag.a .d{background:var(--acc)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.01em;background:var(--fill);color:var(--text-2);white-space:nowrap}
.pill.a{background:var(--acc-soft);color:var(--acc)}
.pill.r{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.pill.o{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}
.pill.g{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.orb{width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#9AD3FF 32%,#3A6DFF 72%,#1B1F6B)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--fill-2);border-top-color:var(--acc);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ok{width:16px;height:16px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.ok svg{width:10px;height:10px;stroke:#fff;stroke-width:2.6}
.meter{height:4px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--acc);border-radius:4px}
.mono{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;letter-spacing:0}
.mono.lg{width:32px;height:32px;border-radius:8px;font-size:12px}
.rng{width:100%;accent-color:var(--acc)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk i{width:16px;height:16px;border-radius:4px;background:var(--fill-2);display:grid;place-items:center;flex:none}
.chk.on i{background:var(--acc)}.chk.on i::after{content:"";width:7px;height:3.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.rad{width:16px;height:16px;border-radius:50%;background:var(--fill-2);display:inline-grid;place-items:center;flex:none}
.rad.on{background:var(--acc)}.rad.on::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 1px var(--border) inset}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--group),0 0 0 3.5px var(--text)}
.sw .custom{background:conic-gradient(#f55,#fd5,#5e8,#5cf,#76f,#f5d,#f55)}
.hk{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 8px;border-radius:7px;background:var(--fill)}
.hk.rec{box-shadow:0 0 0 1px var(--acc) inset,0 0 0 3px var(--acc-soft);padding-right:8px;color:var(--acc);font-size:12.5px}

/* ════════ Lists (macOS grouped) ════════ */
.sect{font-size:12px;font-weight:600;color:var(--text-2);margin:22px 4px 7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect:first-child{margin-top:0}
.sect .btn{font-weight:500}
.group{background:var(--group);border-radius:var(--r-m);box-shadow:0 0 0 1px var(--border);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:var(--row);padding:7px 14px;position:relative}
.li + .li::before{content:"";position:absolute;top:0;right:0;left:14px;border-top:1px solid var(--sep)}
.li.hasic + .li::before,.li + .li.hasic::before{left:42px}
.li > .i{color:var(--text-2)}
.li .tx{flex:1;min-width:0}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .s{font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
.li .end{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.li .meta,.meta{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.li.click{cursor:pointer}.li.click:hover{background:var(--fill)}
.chev{width:12px;height:12px;color:var(--text-3)}
.note{font-size:12px;color:var(--text-2);margin:8px 4px 0}
.tile{background:var(--group);border-radius:var(--r-m);box-shadow:0 0 0 1px var(--border);padding:14px}
.grid{display:grid;gap:var(--gap)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:var(--group);box-shadow:0 0 0 1px var(--border);border-radius:var(--r-m);padding:13px 14px;width:100%;transition:box-shadow .15s}
.option[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc)}
.option .rad{margin-top:1px}
.option .ot{flex:1;min-width:0}
.option .ot b{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.option .ot span{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-m);background:var(--fill);font-size:12.5px;color:var(--text-2)}
.alert b{display:block;color:var(--text);font-weight:600}
.alert .i{margin-top:1px}
.alert.t-warn .i{color:var(--orange)}.alert.t-err .i{color:var(--red)}.alert.t-ok .i{color:var(--green)}.alert.t-info .i{color:var(--acc)}
.alert.t-danger{background:color-mix(in srgb,var(--red) 9%,transparent)}.alert.t-danger .i{color:var(--red)}
.empty{text-align:center;padding:30px 16px;color:var(--text-2)}
.empty .i{width:28px;height:28px;color:var(--text-3);margin-bottom:8px}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.stat .v{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--text-2)}

/* ════════ Control Center window ════════ */
.win{border-radius:12px;overflow:hidden;background:var(--win);box-shadow:var(--win-shadow);display:flex;height:780px}
.side{width:236px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:10px 10px 12px;overflow:auto;border-right:1px solid var(--sep)}
.side .top{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;margin-bottom:8px}
.side .top .t{font-weight:600;font-size:13px;flex:1}
.side .search{margin:0 0 10px;cursor:pointer}
.side .g{font-size:11px;font-weight:600;color:var(--text-3);padding:12px 8px 4px}
.side a{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;color:var(--text);font-size:13px;cursor:pointer;text-decoration:none}
.side a .i{color:var(--text-2)}
.side a:hover{background:var(--fill)}
.side a.on{background:var(--fill-2)}
.side a.on .i{color:var(--acc)}
.side a .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--sep)}
.side .me .l{font-size:12px;line-height:1.3;flex:1;min-width:0}
.side .me .l span{color:var(--text-2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:44px;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 6px 0 32px;flex:none}
.bar .wc{display:flex}.bar .wc span{width:40px;height:30px;display:grid;place-items:center;color:var(--text-2);font-size:11px;border-radius:6px}.bar .wc span:hover{background:var(--fill)}
.bar .crumb{margin-right:auto;font-size:12.5px;color:var(--text-3)}
.content{flex:1;overflow:auto;padding:4px 32px 40px;scrollbar-gutter:stable}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 20px}
.ph h2{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0}
.ph p{margin:2px 0 0;color:var(--text-2)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.narrow{max-width:760px}

/* chat */
.chat{display:grid;grid-template-columns:230px 1fr;height:calc(100% + 40px);margin:0 -32px -40px;border-top:1px solid var(--sep)}
.threads{border-right:1px solid var(--sep);padding:10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.threads a{padding:8px 10px;border-radius:7px;cursor:pointer}
.threads a:hover{background:var(--fill)}.threads a.on{background:var(--fill-2)}
.threads a b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.threads a small{color:var(--text-3);font-size:11.5px}
.conv{display:flex;flex-direction:column;min-height:0}
.conv .ch{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--sep)}
.msgs{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.you{align-self:flex-end;max-width:70%;background:var(--ink);color:var(--ink-fg);padding:8px 13px;border-radius:16px 16px 5px 16px}
.kv{display:flex;gap:10px;max-width:80%}
.kv .orb{margin-top:2px}
.kv p{margin:0 0 6px}
.step-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:5px 0}
.why{font-size:11.5px;color:var(--text-3)}
.composer{padding:12px 20px;border-top:1px solid var(--sep);display:flex;gap:8px;align-items:center}
.composer .field{flex:1;height:36px;border-radius:999px;padding:0 14px}
code{font-family:var(--mono);font-size:12px;background:var(--fill);padding:1px 5px;border-radius:4px}

/* routine */
.rstep{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--group);box-shadow:0 0 0 1px var(--border);border-radius:var(--r-m)}
.rstep .n{font-size:11px;color:var(--text-3);width:14px;font-variant-numeric:tabular-nums}
.rstep .tx{flex:1;min-width:0}
.rline{width:1.5px;height:10px;background:var(--border);margin-left:18px}
/* usage chart */
.chart{display:flex;align-items:flex-end;gap:5px;height:130px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:1px}
.chart .b i{display:block;background:var(--acc);border-radius:3px 3px 1px 1px}
.chart .b i.s{background:color-mix(in srgb,var(--acc) 35%,transparent);border-radius:1px}
.chart .b span{font-size:10px;color:var(--text-3);text-align:center;margin-top:4px}
.budget{position:relative;height:6px;border-radius:6px;background:var(--fill-2)}
.budget span{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--acc)}
.budget em{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--text-3)}
/* home */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;padding:38px 0 10px}
.home .big{width:84px;height:84px;border-radius:50%;background:#000;display:grid;place-items:center;margin-bottom:18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.home .big .orb{width:34px;height:34px;box-shadow:0 0 24px rgba(120,170,255,.7)}
.home h2{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.home p{color:var(--text-2);margin:6px 0 0}

/* ════════ Desktop stage + Island ════════ */
.stage{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;isolation:isolate;container-type:inline-size;box-shadow:var(--win-shadow)}
.wallp{position:absolute;inset:0;z-index:-2}
[data-theme="light"] .wallp{background:radial-gradient(60% 80% at 78% 30%,#CFDCE8,transparent 60%),radial-gradient(70% 70% at 10% 90%,#EADCCB,transparent 60%),linear-gradient(160deg,#EEF1F4,#DDE4EB 55%,#EAE3DA)}
[data-theme="dark"] .wallp{background:radial-gradient(60% 80% at 78% 25%,#29394C,transparent 60%),radial-gradient(70% 70% at 10% 95%,#3A2E27,transparent 60%),linear-gradient(160deg,#15181D,#1B2129 55%,#1E1A17)}
.dapp{position:absolute;left:10%;top:10%;width:62%;height:70%;border-radius:8px;overflow:hidden;background:var(--group);box-shadow:0 0 0 1px var(--border),0 18px 50px -20px rgba(0,0,0,.4)}
.dapp .tb{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid var(--sep);font-size:12px;color:var(--text-2)}
.dapp .tb .sp{flex:1}
.dapp .tb .fb{height:24px;padding:0 10px;border-radius:6px;background:var(--fill);display:grid;place-items:center;font-size:11.5px;color:var(--text)}
.dapp .dc{padding:3cqw 5cqw}
.dapp .dc h4{font-family:var(--disp);font-size:max(14px,1.9cqw);margin:0 0 .8cqw}
.dapp .dc p{margin:0 0 1cqw;font-size:max(10px,1.1cqw);color:var(--text-2);line-height:1.6}
.dtask{position:absolute;left:0;right:0;bottom:0;height:5.6%;display:flex;align-items:center;justify-content:center;gap:.8cqw;backdrop-filter:blur(20px);background:color-mix(in srgb,var(--group) 80%,transparent);border-top:1px solid var(--sep)}
.dtask i{width:2cqw;height:2cqw;border-radius:.45cqw;background:var(--fill-2)}
.dtask .ck{position:absolute;right:1.2cqw;font-size:max(9px,.85cqw);text-align:right;line-height:1.2;color:var(--text-2)}
.dtask .tk{position:absolute;right:6cqw;width:1.5cqw;height:1.5cqw}
.glow{position:absolute;inset:0;pointer-events:none;border-radius:12px;transition:box-shadow .5s}
.glow.on{box-shadow:inset 0 0 0 2px rgba(140,190,255,.85),inset 0 0 50px rgba(120,170,255,.35)}

.island{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--isl);color:var(--isl-fg);border-radius:20px;width:0;height:36px;overflow:hidden;opacity:0;box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset,0 16px 36px -14px rgba(0,0,0,.7);text-align:left;transition:width .55s var(--spring),height .55s var(--spring),border-radius .45s var(--out),opacity .18s;z-index:6;font-size:13px}
.island.show{opacity:1}
.island.bottom{top:auto;bottom:calc(5.6% + 12px)}
.island.static{position:static;transform:none;opacity:1}
.island .row{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px 0 9px;white-space:nowrap}
.island .row .orb{width:18px;height:18px}
.island .lab{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.island .lab small{font-weight:400;color:var(--isl-2);margin-left:6px;font-size:12.5px}
.island canvas{width:44px;height:18px;flex:none}
.island .mchip{height:18px;padding:0 6px;border-radius:5px;background:var(--isl-3);font-size:10.5px;font-weight:600;display:grid;place-items:center;color:var(--isl-2)}
.island .mchip.r{background:rgba(255,81,71,.22);color:#FF8A80}
.island .body{padding:2px 16px 15px;line-height:1.45;opacity:0;transition:opacity .2s .12s;white-space:normal}
.island.tall .body{opacity:1}
.island .q{color:var(--isl-2)}
.island .a{margin-top:7px}
.island .steps{margin-top:9px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--isl-2)}
.island .steps div{display:flex;gap:8px;align-items:center}
.island .steps b{color:#fff;font-weight:600}
.island .btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.island .btns span{height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:500;cursor:pointer}
.island .row .btns span{height:24px;padding:0 10px}
.island .btns span.p{background:#fff;color:#000}
.island .btns span.d{color:#FF8A80}
.island .warn{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:#FFC857;margin-bottom:5px}
.island .warn.r{color:#FF8A80}
.island .ispin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:#8AB8FF;animation:spin .8s linear infinite;flex:none}
.island .iok{width:14px;height:14px;border-radius:50%;background:#32D74B;flex:none}
.island .prog{height:3px;width:64px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;flex:none}
.island .prog span{display:block;height:100%;background:#8AB8FF}
.island .ring{width:16px;height:16px;border-radius:50%;flex:none;background:conic-gradient(#fff var(--p,70%),rgba(255,255,255,.18) 0)}
.island .ring.t{animation:ringdown 8s linear forwards}
@property --p{syntax:'<percentage>';inherits:false;initial-value:100%}
@keyframes ringdown{from{--p:100%}to{--p:0%}}
.island .ex{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.island .ex div{font-size:12.5px;color:#fff;background:rgba(255,255,255,.07);border-radius:8px;padding:6px 10px}
.island .inp{margin-top:10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;font-size:13px}
.island .appi{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;flex:none}
.island .plan{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.island .plan div{display:flex;gap:8px}
.island .plan i{font-style:normal;color:var(--isl-2);width:14px;font-variant-numeric:tabular-nums}
.island .kbd{background:rgba(255,255,255,.12);color:var(--isl-2);box-shadow:none}
.island .vh{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--isl-2)}
.island .vh b{color:#fff;font-weight:500}
.island .mic{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.12);position:relative}
.island .mic::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid rgba(138,184,255,.8);animation:pulse 1.4s var(--out) infinite}
.island .mic svg{width:11px;height:11px}
.island .draft{margin-top:8px;background:rgba(255,255,255,.07);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;color:#fff}
.island .draft ins{text-decoration:none;background:rgba(138,184,255,.22);border-radius:3px;padding:0 2px}
.soundset{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.soundset .option{align-items:center}
.code-edit{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--group);box-shadow:0 0 0 1px var(--border);border-radius:var(--r-m);padding:12px 14px;white-space:pre-wrap;color:var(--text)}
.code-edit .c{color:var(--text-3)}
.rf{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;color:var(--text-3)}
.rf .btn{height:22px;padding:0 8px;font-size:12px}
.rf .btn .i{width:13px;height:13px}
.rf.busy .btn .i{animation:spin .8s linear infinite}
.newdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:middle}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.themes .option{flex-direction:column;align-items:stretch;gap:10px;padding:10px}
.themes .pv{height:78px;border-radius:7px;overflow:hidden;display:flex;box-shadow:0 0 0 1px var(--border)}
.themes .pv .sb{width:30%;display:flex;flex-direction:column;gap:5px;padding:8px 6px}
.themes .pv .sb i,.themes .pv .mn i{display:block;height:5px;border-radius:3px}
.themes .pv .mn{flex:1;display:flex;flex-direction:column;gap:6px;padding:10px 8px}
.themes .pv .pill-i{width:46%;height:10px!important;border-radius:6px!important;background:#000;align-self:center;margin-bottom:4px}
.themes .ot{display:flex;align-items:center;gap:8px}
.explain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.explain .tile{display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:box-shadow var(--t-base)}
.explain .tile:hover{box-shadow:0 0 0 1px var(--acc)}
.explain .tile b{display:block;font-size:13px}.explain .tile span{font-size:12px;color:var(--text-2)}
@media (max-width:980px){.themes,.explain{grid-template-columns:1fr}}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--sep);margin:-6px 0 22px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ptabs button{border:0;background:transparent;padding:0 0 10px;font-size:13px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button:hover{color:var(--text)}
.ptabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--ink)}
.ph.sub{margin:0 0 18px;align-items:center}.ph.sub p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{height:24px;padding:0 9px;border-radius:999px;border:0;background:var(--fill);font-size:12px;color:var(--text-2)}
.tags button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.vault{display:grid;grid-template-columns:220px 1fr;gap:var(--gap);align-items:start}
.tree{background:var(--group);box-shadow:0 0 0 1px var(--border);border-radius:var(--r-m);padding:8px;font-size:13px}
.tree a{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;cursor:pointer;color:var(--text)}
.tree a .i{color:var(--text-2)}.tree a:hover{background:var(--fill)}.tree a.on{background:var(--fill-2)}
.tree a .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.tree .in{padding-left:18px}
.note-prev{background:var(--group);box-shadow:0 0 0 1px var(--border);border-radius:var(--r-m);padding:16px 18px}
.note-prev .fm{font-family:var(--mono);font-size:11.5px;color:var(--text-3);line-height:1.6;margin-bottom:10px}
.note-prev h4{font-family:var(--disp);font-size:17px;margin:0 0 8px}
.note-prev ul{margin:0;padding-left:18px;line-height:1.7}
.note-prev .wl{color:var(--acc)}
@media (max-width:980px){.vault{grid-template-columns:1fr}}
.ctxbar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--fill-2);gap:1px}
.ctxbar i{display:block;height:100%}
.ctxleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text-2);margin-top:8px}
.ctxleg span{display:inline-flex;align-items:center;gap:5px}.ctxleg b{width:8px;height:8px;border-radius:2px;display:inline-block}
.cmeter{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.cmeter .m{width:54px;height:4px;border-radius:3px;background:var(--fill-2);overflow:hidden}.cmeter .m span{display:block;height:100%;background:var(--text-3)}
.threads .new{margin-bottom:6px;justify-content:flex-start}
.threads .tg{font-size:11px;font-weight:600;color:var(--text-3);padding:10px 10px 4px}
.xmenu{width:280px;background:var(--group);border-radius:8px;padding:4px;box-shadow:0 0 0 1px var(--border),var(--shadow);font-size:13px}
.xmenu .mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:4px}
.xmenu .mi.hl{background:var(--fill)}
.xmenu .mi .i{color:var(--text-2)}
.xmenu hr{border:0;border-top:1px solid var(--sep);margin:4px 6px}
.jump{width:260px;background:var(--group);border-radius:8px;padding:8px 4px 4px;box-shadow:0 0 0 1px var(--border),var(--shadow);font-size:13px}
.jump .jh{font-size:11px;font-weight:600;color:var(--text-3);padding:4px 10px 6px}
.jump .mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:4px}
.jump .mi .i{color:var(--text-2)}
.reply{display:flex;gap:6px;margin-top:10px}.reply .field{flex:1;border-radius:4px;height:30px}
.sheetwin{width:420px;max-width:100%;background:var(--win);border-radius:12px;box-shadow:0 0 0 1px var(--border),var(--shadow);padding:22px}
.sheetwin h3{font-family:var(--disp);margin:0 0 4px;font-size:18px}
.sheetwin ul{margin:12px 0 16px;padding-left:18px;color:var(--text-2);font-size:13px;line-height:1.7}

/* computer use layer */
.cu{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5}
.cu.on{opacity:1}
.cu .edge{position:absolute;inset:0;border-radius:12px}
.cu[data-frame="subtle"] .edge{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 80%,transparent),inset 0 0 36px color-mix(in srgb,var(--acc) 22%,transparent)}
.cu[data-frame="full"] .edge{box-shadow:inset 0 0 0 3px var(--acc),inset 0 0 60px color-mix(in srgb,var(--acc) 30%,transparent)}
.cu .target{position:absolute;border-radius:8px;box-shadow:0 0 0 2px var(--acc),0 0 0 6px color-mix(in srgb,var(--acc) 25%,transparent);animation:tpulse 1.6s var(--out) infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 2px var(--acc),0 0 0 10px color-mix(in srgb,var(--acc) 0%,transparent)}}
.cu .callout{position:absolute;background:#000;color:#fff;border-radius:10px;padding:7px 8px 7px 10px;font-size:12px;display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:auto;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.cu .callout .btns{display:flex;gap:4px}
.cu .callout .btns span{height:22px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;font-size:11.5px;cursor:pointer}
.cu .callout .btns span.p{background:#fff;color:#000;font-weight:600}
.cu .cursor{position:absolute;width:18px;height:18px}

/* controls under stage */
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.ctl .lb{font-size:12px;color:var(--text-3);margin-right:4px;min-width:96px}
.ctl .c{height:26px;padding:0 10px;border-radius:999px;border:0;background:var(--fill);font-size:12.5px;color:var(--text-2)}
.ctl .c[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.sheet-grid .cell{background:var(--group);box-shadow:0 0 0 1px var(--border);border-radius:var(--r-m);padding:16px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.sheet-grid .cell .cap{font-size:12px;color:var(--text-2)}
.sheet-grid .island{max-width:100%}

/* ════════ Onboarding ════════ */
.ob{border-radius:12px;overflow:hidden;background:var(--win);box-shadow:var(--win-shadow);display:flex;flex-direction:column;height:760px;position:relative}
.ob .obbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.ob .obbar .t{font-size:12.5px;color:var(--text-3)}
.obprog{display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;border-radius:999px;height:28px;padding:0 12px 0 10px;font-size:12px;font-weight:500}
.obprog .pd{display:flex;gap:5px}
.obprog .pd i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .3s var(--out)}
.obprog .pd i.done{background:rgba(255,255,255,.7)}
.obprog .pd i.on{width:18px;border-radius:3px;background:#fff}
.ob .obody{flex:1;overflow:auto;display:flex;justify-content:center;padding:22px 28px 20px}
.ob .col{width:100%;max-width:560px;display:flex;flex-direction:column}
.ob .eb{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:6px}
.ob h2{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.ob .sub{color:var(--text-2);margin:0 0 22px;font-size:14.5px}
.ob .foot{display:flex;align-items:center;gap:8px;padding:14px 24px 16px;flex:none;border-top:1px solid var(--sep)}
.ob .foot .sp{flex:1}
.ob .welcome{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.ob .welcome h2{font-size:40px;letter-spacing:-.025em;margin:28px 0 10px}
.ob .welcome p{color:rgba(255,255,255,.6);font-size:15.5px;max-width:460px;margin:0 0 30px}
.ob .welcome .btn.pri{background:#fff;color:#000;height:36px;padding:0 20px;font-size:14px}
.ob .welcome .fine{position:absolute;bottom:22px;left:0;right:0;font-size:12px;color:rgba(255,255,255,.4);display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.ob .welcome .fine span{display:inline-flex;align-items:center;gap:6px}
.ob .welcome .island{box-shadow:0 0 0 .5px rgba(255,255,255,.2) inset,0 20px 60px -10px rgba(58,109,255,.35)}
.lvl{display:flex;gap:3px;align-items:center;height:28px}
.lvl i{width:3px;border-radius:2px;background:var(--acc);height:5px;animation:lv 1s ease-in-out infinite}
@keyframes lv{50%{height:22px}}
.recb{width:60px;height:60px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;position:relative;flex:none}
.recb svg{width:22px;height:22px}
.recb::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--red);opacity:.5;animation:pulse 1.4s var(--out) infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.recs{display:flex;gap:6px;justify-content:center}
.recs i{width:22px;height:4px;border-radius:3px;background:var(--fill-2)}
.recs i.done{background:var(--ink)}.recs i.on{background:var(--red)}
.mini{position:relative;height:220px;border-radius:var(--r-m);overflow:hidden;box-shadow:0 0 0 1px var(--border);container-type:inline-size;flex:none}
.mini .dapp{left:12%;top:28%;width:76%;height:60%}

/* ════════ Overlays ════════ */
.scrim{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;background:rgba(0,0,0,.28)}
.scrim.on{display:flex}
.scrim.center{align-items:center;padding-top:16px}
.modal{width:min(520px,100%);max-height:84vh;overflow:auto;background:var(--win);border-radius:14px;box-shadow:0 0 0 1px var(--border),0 30px 80px -20px rgba(0,0,0,.5)}
.modal .mh{padding:18px 20px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .mh h3{margin:0;font-family:var(--disp);font-size:17px;font-weight:600}
.modal .mh p{margin:3px 0 0;color:var(--text-2);font-size:12.5px}
.modal .mb{padding:12px 20px 4px}

  el.innerHTML = `<div class="row">${m.lead || '<span class="orb"></span>'}<span class="lab">${m.lab}</span>${right}</div><div class="body">${m.body || ''}</div>`;

    const probe = document.createElement('div'); probe.className = 'island static tall';
    const pw = el.parentElement ? el.parentElement.clientWidth - (el.classList.contains('static') ? 24 : 0) : m.w;

/* waveform loop — runs only while the Island is audible (zero frames at rest) */
const OV = { state:'listening', partial:'Play something calm on Spotify and', pos:'top', glow:false, cu:false, frame:'subtle', targets:true, watch:true, cursor:true };
let amp = 0, t = 0, raf = null;
const loud = () => ['listening','speaking','media','guest'].includes(OV.state);
const tick = () => {
  t += 1/60; const tgt = loud() ? .35 + .65*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.7+1) + .25*Math.sin(t*9)) : 0;
  amp += (tgt - amp) * .12;
  const c = document.getElementById('ovWave');
  if (c) { const x = c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
    for (let i=0;i<5;i++){ const h = 5 + (c.height-8)*Math.max(.08, amp*(.5+.5*Math.abs(Math.sin(t*6+i*1.3)))); x.fillStyle = OV.state==='speaking'?'#9AD3FF':'#fff'; x.beginPath(); x.roundRect(6+i*17,(c.height-h)/2,7,h,3.5); x.fill(); } }
  if (S.sec !== 'overlay' || (!loud() && amp < .003)) { raf = null; return; }
  raf = requestAnimationFrame(tick);
};
const kick = () => { if (!raf && !matchMedia('(prefers-reduced-motion: reduce)').matches) raf = requestAnimationFrame(tick); };

    ${c('Side sheets', `<button class="btn" data-sheet="cu">Computer use options</button><button class="btn" data-sheet="mode">Permission mode</button>`, 'Base UI Dialog as a sheet')}
    ${c('Toast', `<button class="btn" data-toast="Routine saved">Show toast</button>`, 'custom · black capsule with Undo')}
  </div>`;
};

/* ════════ Modals, sheets, palette ════════ */
const MODALS = {
  wake: () => `<div class="modal"><div class="mh"><div><h3>Add a wake word</h3><p>Type it, check it, record it.</p></div><button class="btn sm ic plain" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb"><div class="field">${I('mic')}<input value="Okay Jarvis"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 2px 0;flex-wrap:wrap">${tag('Good choice','g')}<span style="font-size:12px;color:var(--text-2);flex:1">4 syllables · distinctive · no conflicts</span><button class="btn sm plain">${I('play')}Hear it</button></div>
    ${sect('Record 5 samples · optional')}
    <div style="display:flex;align-items:center;gap:12px"><div class="recs" style="flex:1;justify-content:flex-start">${[1,2,3,4,5].map(i=>`<i class="${i<3?'done':''}"></i>`).join('')}</div><button class="btn pri sm">${I('mic')}Record 3</button></div>
    ${sect('Sensitivity')}<input class="rng" type="range" value="50" aria-label="Sensitivity"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-3)"><span>Fewer false wakes</span><span>Wakes more easily</span></div>
    <p class="note" style="margin:10px 0 0">Tested on 10 minutes of background speech: 0 false wakes.</p></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close data-toast="Wake word added">Add</button></div></div>`,
  routine: () => `<div class="modal"><div class="mh"><div><h3>New routine</h3><p>Describe it, or start from a template.</p></div><button class="btn sm ic plain" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb"><div class="field">${I('sparkle')}<input value="When I say work mode, open VS Code and Slack and turn on Focus"></div><p class="note" style="margin:6px 2px 0">KIVO drafts the steps; you review them before saving.</p>
    ${sect('Templates')}${group(li('routine','Work mode','Open apps and turn on Focus',chev,'click'), li('clock','Focus timer','Timer and Do Not Disturb',chev,'click'), li('users','Meeting','Mute, headset, calendar link',chev,'click'), li('moon','Goodnight','Close apps, then sleep (asks first)',chev,'click'))}</div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close>Continue</button></div></div>`,
  install: () => `<div class="modal"><div class="mh"><div><h3>Install GitHub Copilot CLI</h3><p>KIVO runs the installer for you and checks that it works.</p></div><button class="btn sm ic plain" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb">${group(li('check','Node.js','Already installed · v22.4', tag('Ready','g')), li('download','Copilot CLI','From the official npm package', '<span class="meta">~40 MB</span>'))}
    <div class="code-edit" style="margin-top:12px">npm install -g @github/copilot</div>
    <p class="note" style="margin:10px 2px 0">After installing, you’ll sign in with your GitHub account in a browser window. Nothing is installed without this confirmation.</p></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close data-toast="Installing GitHub Copilot CLI…">Install</button></div></div>`,
  mcpadd: () => `<div class="modal"><div class="mh"><div><h3>Add an MCP server</h3><p>Paste a link from the developer, or pick a program on this PC.</p></div><button class="btn sm ic plain" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb">${seg(['Link (remote)','Program on this PC'],'Link (remote)')}
    <div class="field" style="margin-top:12px">${I('link')}<input value="https://mcp.linear.app/mcp"></div>
    <p class="note" style="margin:8px 2px 0">Sign-in happens in your browser if the server needs it. No keys to paste.</p>
    ${sect('New tools start as')}${seg(['Ask first','Medium','Low'],'Ask first')}
    <div style="margin-top:14px">${alertB('info','Only add servers you trust','KIVO shows every tool the server offers before turning it on.')}</div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close data-toast="Linear connected · 9 tools">Connect</button></div></div>`,
  launch: () => `<div class="modal"><div class="mh"><div><h3>Start an agent</h3><p>Or just say “Hey Kivo, open Claude in K.I.V.O with auto mode”.</p></div><button class="btn sm ic plain" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb">${group(li(mono('CC','#C96442'),'Agent','', `<span class="select">Claude Code${chev}</span>`), li('folder','Folder','', `<span class="select">K.I.V.O${chev}</span>`), li('window','Where','', seg(['Background','Terminal'],'Terminal')), li('shield','Permission mode','', seg(['Ask','Auto','Bypass'],'Auto')))}
    <p class="note">Bypass lets the agent change anything without asking, so KIVO will confirm first.</p></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn pri" data-close data-toast="Claude started in K.I.V.O">Start</button></div></div>`,
  bypass: () => `<div class="modal"><div class="mh"><div><h3>Turn on Bypass permissions?</h3><p>KIVO will act without asking, including deleting, sending and paying.</p></div></div>
    <div class="mb">${alertB('danger','Only for tasks you’re watching','Hard limits still apply: emergency stop, capabilities you turned off, blocked apps, password fields, and addresses from untrusted content.')}
    ${sect('Turn off automatically after')}${seg(['15 min','1 hour','Until I turn it off'],'1 hour')}
    <div style="margin-top:14px"><label class="chk on" style="font-size:12.5px"><i></i>Confirm with Windows Hello</label></div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn stop" data-bypass>Turn on Bypass</button></div></div>`
};
const SHEETS = {
  cu: () => `<div class="sh"><h3>Computer use</h3><button class="btn sm ic plain" data-closesheet aria-label="Close">${I('x')}</button></div><div class="sb">
    <p style="color:var(--text-2);margin:0 0 14px">When nothing else works, KIVO can look at your screen and use the mouse and keyboard. It’s slower and costs more, so it stays off until you turn it on.</p>
    ${group(li('hand','Allow computer use','', tog(false)))}
    ${sect('While it’s working')}${group(li('frame','Screen frame','', seg(['Off','Subtle','Full'],'Subtle')), li('cursor','Show KIVO’s cursor','A second pointer shows where it acts', tog(true)), li('eye','Highlight the target','A ring around what it’s about to click', tog(true)), li('island','Island controls','Pause and Stop while it works', tog(true)))}
    ${sect('Control')}${group(li('check','Approve each step','', seg(['Always','First 10 tasks','Never'],'First 10 tasks')), li('mouse','Pause when I use the mouse','Waits, then resumes when you stop', tog(true)), li('zap','Speed','', seg(['Careful','Normal','Fast'],'Normal')))}
    ${sect('Limits')}${group(li('list','Max steps per task','', `<div class="field" style="width:70px"><input value="25"></div>`), li('coin','Max cost per task','', `<div class="field" style="width:80px">$<input value="0.50"></div>`), li('clock','Time limit','', seg(['1 min','2 min','5 min'],'2 min')))}
    ${sect('Apps')}${group(li('check','Allowed apps','Notes, Photoshop, Figma', chev,'click'), li('lock','Never touch','Password managers, banking, Windows Security', chev,'click'))}
    <p class="note">Screenshots stay in memory and are never saved.</p></div>`,
  preview: () => `<div class="sh"><h3>What the AI sees</h3><button class="btn sm ic plain" data-closesheet aria-label="Close">${I('x')}</button></div><div class="sb">
    <p style="color:var(--text-2);margin:0 0 12px">The exact start of the next conversation with <b>Claude Sonnet</b>. Secrets are hidden.</p>
    <div class="code-edit"><span class="c"># System · 600 tokens · cached</span>
You are KIVO, a voice-first assistant on Windows. Keep spoken answers short…
<span class="c"># About me · 400 · cached</span>
Call me Sam. Windows 11, VS Code, PowerShell. Reply in the language I speak.
<span class="c"># Live context · 100</span>
Active app: VS Code (K.I.V.O) · 16:42 · Mode: Auto
<span class="c"># Memory · 3 items</span>
- Tests use cargo nextest (kivo-runtime)
<span class="c"># Skills · names only</span>
release-notes, meeting-brief, pdf-tools</div>
    <p class="note">Tools are added only when a request needs them.</p></div>`,
  mode: () => `<div class="sh"><h3>Permission mode</h3><button class="btn sm ic plain" data-closesheet aria-label="Close">${I('x')}</button></div><div class="sb">
    <div style="display:flex;flex-direction:column;gap:8px">${MODES.map(([k,n,d,x]) => option(n, d, S.mode===k, x==='Recommended'?pill('Recommended','a'):k==='bypass'?pill('Use with care','r'):'', k==='bypass'&&S.mode!=='bypass'?'data-modal="bypass"':`data-set="mode" data-val="${k}"`)).join('')}</div>
    <p class="note">${keys('Ctrl','Shift','M')} cycles modes. The Island shows the current mode while KIVO acts.</p></div>`
};
const PAL = [['Settings','mic','Wake words','go:voice'],['Settings','shield','Permission mode','sheet:mode'],['Settings','hand','Computer use options','sheet:cu'],['Settings','palette','Accent color','go:settings'],['Settings','chart','Usage and limits','go:usage'],['Routines','routine','Run “Work mode”','toast:Work mode started'],['Routines','routine','Run “Morning brief”','toast:Morning brief started'],['Actions','plus','Add wake word','modal:wake'],['Actions','pause','Pause listening','toast:Listening paused'],['Actions','stop','Stop everything','toast:Stopped everything']];
const palList = q => { const r = PAL.filter(x => x[2].toLowerCase().includes(q.toLowerCase())); let g = '';
  return r.length ? r.map((x,i) => { const h = x[0] !== g ? `<div class="pg">${(g = x[0])}</div>` : ''; return h + `<div class="pi ${i===0?'sel':''}" data-pal="${x[3]}">${I(x[1])}${x[2]}<span class="k">${x[3].startsWith('go')||x[3].startsWith('sheet')?'Open':x[3].startsWith('toast')?'Run':'Action'}</span></div>`; }).join('')
    : `<div class="pg">Ask KIVO</div><div class="pi sel">${I('sparkle')}“${q.replace(/[<>&]/g,'')}”<span class="k">↵</span></div>`; };
const paletteHTML = () => `<div class="palette" role="dialog" aria-label="Search KIVO"><div class="pin">${I('search')}<input id="palIn" placeholder="Search settings, run routines, ask KIVO…"></div>
  <div id="palList">${palList('')}</div><div class="pf"><span>↵ open</span><span>Esc close</span></div></div>`;

/* ════════ Render + events ════════ */
const page = document.getElementById('page'), scrim = document.getElementById('scrim'), box = document.getElementById('overlayBox'), sheet = document.getElementById('sheet'), toastEl = document.getElementById('ktoast');
let tabChanged = false, lastInd = null, onbDir = 0, welcomeTimer;
const render = () => {
  S.theme = S.themePref === 'system' ? (sysDark.matches ? 'dark' : 'light') : S.themePref;
  R.dataset.theme = S.theme; R.dataset.accent = S.accent; R.dataset.textsize = S.textsize; save();
  document.querySelectorAll('#secTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === S.sec));
  document.querySelectorAll('#vTheme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.val === S.themePref));
  document.getElementById('vAcc').innerHTML = ACC.map(([k,c,n]) => `<button data-set="accent" data-val="${k}" style="background:${c}" aria-pressed="${S.accent===k}" title="${n}" aria-label="${n}"></button>`).join('');
  const y = window.scrollY, ccScroll = document.getElementById('cc')?.scrollTop || 0, samePage = page.dataset.k === S.sec + S.page;
  page.innerHTML = { overlay:overlayHTML, cc:ccHTML, onb:onbHTML, sys:sysHTML, comp:compHTML }[S.sec]();
  page.dataset.k = S.sec + S.page;
  const cc = document.getElementById('cc'); if (cc && samePage) cc.scrollTop = ccScroll; window.scrollTo(0, y);
  // motion: stagger content when the page (not just a setting) changes
  if (!samePage || tabChanged) ['#cc','.gal','.sgrid','.sheet-grid','.tokens','#page > .intro'].forEach(sel => document.querySelectorAll(sel).forEach(c => { [...c.children].forEach((ch,i) => ch.style.setProperty('--i', Math.min(i, 12))); c.classList.add('anim-in'); }));
  tabChanged = false;
  // sliding tab indicator
  const ind = document.querySelector('.ptabs .ind'), act = document.querySelector('.ptabs [aria-selected="true"]');
  if (ind && act) { const to = {l: act.offsetLeft, w: act.offsetWidth}; if (lastInd && lastInd.pg === S.page) { ind.style.left = lastInd.l + 'px'; ind.style.width = lastInd.w + 'px'; ind.getBoundingClientRect(); } ind.style.left = to.l + 'px'; ind.style.width = to.w + 'px'; lastInd = {pg: S.page, ...to}; }
  // onboarding direction
  const col = document.querySelector('.ob .col'); if (col && onbDir) col.classList.add(onbDir > 0 ? 'fwd' : 'back'); onbDir = 0;
  // reveal system surfaces as they scroll in
  const sfs = document.querySelectorAll('.sf'); if (sfs.length) { const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } }), {threshold:.15}); sfs.forEach((el,i) => { el.style.transitionDelay = (i % 3) * 60 + 'ms'; io.observe(el); }); }
  // onboarding welcome: the Island demonstrates itself
  clearInterval(welcomeTimer); const w = document.querySelector('.welcome [data-isl]');
  if (w) { const seq = [{state:'listening',partial:'“Hey Kivo, what’s on my calendar today?”'},{state:'thinking'},{state:'speaking'}]; let k = 0;
    welcomeTimer = setInterval(() => { k = (k + 1) % seq.length; const st = seq[k]; drawIsland(w, st); if (st.state === 'speaking') { w.querySelector('.body').innerHTML = '<div class="q">What’s on my calendar today?</div><div class="a">Design review with Maya at 3, then gym at 6.</div>'; w.style.height = (w.querySelector('.row').offsetHeight + w.querySelector('.body').scrollHeight) + 'px'; } staticWave(w); }, 2600); }
  const isl = document.getElementById('ovIsland'); if (isl) { drawIsland(isl, OV, 'ovWave'); kick(); }
  document.querySelectorAll('[data-isl]').forEach(el => { const k = el.dataset.isl;
    if (k === 'welcome') { drawIsland(el, {state:'listening', partial:'“Hey Kivo, what’s on my calendar today?”'}); staticWave(el); return; }
    drawIsland(el, {state:k, partial: k==='listening' ? 'Play something calm on Spotify' : ''}); staticWave(el); });
};
const ovSet = (state, partial) => { OV.state = state; OV.partial = partial !== undefined ? partial : (state === 'listening' ? 'Play something calm on Spotify and' : '');
  if (state === 'cu' && !OV.cu) { OV.cu = true; render(); return; }
  const isl = document.getElementById('ovIsland'); if (!isl) return; drawIsland(isl, OV, 'ovWave');
  document.querySelectorAll('[data-ov]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ov === state)); kick(); };
let T = []; const stopT = () => { T.forEach(clearTimeout); T = []; }; const at = (ms, fn) => T.push(setTimeout(fn, ms));
const playReq = () => { stopT(); ovSet('idle');
  if (OV.glow) { at(120, () => document.getElementById('glow')?.classList.add('on')); at(650, () => document.getElementById('glow')?.classList.remove('on')); }
  at(250, () => ovSet('listening',''));
  const w = REQ.split(' '); let acc = ''; w.forEach((x,i) => at(700 + i*210, () => { acc += (i?' ':'') + x; ovSet('listening', acc); }));
  let k = 700 + w.length*210 + 350;
  at(k, () => ovSet('thinking')); at(k += 900, () => ovSet('acting')); at(k += 1500, () => ovSet('speaking')); at(k += 3000, () => ovSet('followup')); at(k += 2500, () => ovSet('media')); at(k += 3500, () => ovSet('idle'));
};
let toastTimer;
const toast = msg => { toastEl.innerHTML = `${I('check')}${msg}<button class="btn" data-undo>Undo</button>`; toastEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 3200); };
const openModal = k => { box.innerHTML = MODALS[k](); scrim.className = 'scrim on center'; };
const openPalette = () => { box.innerHTML = paletteHTML(); scrim.className = 'scrim on'; setTimeout(() => document.getElementById('palIn')?.focus(), 30); };
const closeOverlay = () => { scrim.className = 'scrim'; box.innerHTML = ''; };
const openSheet = k => { sheet.innerHTML = SHEETS[k](); sheet.classList.add('on'); };
const closeSheet = () => sheet.classList.remove('on');
const runPal = a => { const i = a.indexOf(':'), k = a.slice(0,i), v = a.slice(i+1); closeOverlay();
  if (k==='go') { goTo(v); render(); } else if (k==='sheet') openSheet(v); else if (k==='modal') openModal(v); else toast(v); };

document.addEventListener('click', e => {
  const el = e.target.closest('button,a,[data-go],[data-palette],[data-sheet],[data-pal],[data-undo]'); if (!el) return;
  const d = el.dataset;
  if (d.sec) { stopT(); closeSheet(); S.sec = d.sec; render(); window.scrollTo(0,0); return; }
  if (d.set) { const was = S[d.set]; S[d.set] = d.val; if (d.set==='mode') { closeSheet(); if (was !== d.val) toast(`${modeName(d.val)} mode`); } render(); return; }
  if (d.bypass !== undefined) { S.mode = 'bypass'; closeOverlay(); closeSheet(); render(); toast('Bypass is on for 1 hour'); return; }
  if (d.go) { closeSheet(); goTo(d.go); render(); return; }
  if (d.tab) { S.tabs[S.page] = d.tab; tabChanged = true; render(); return; }
  if (d.palette !== undefined) { openPalette(); return; }
  if (d.pal) { runPal(d.pal); return; }
  if (d.sheet) { openSheet(d.sheet); return; }
  if (d.closesheet !== undefined) { closeSheet(); return; }
  if (d.modal) { closeSheet(); openModal(d.modal); return; }
  if (d.toast) { if (d.close !== undefined) closeOverlay(); toast(d.toast); return; }
  if (d.close !== undefined) { closeOverlay(); return; }
  if (d.undo !== undefined) { toastEl.classList.remove('on'); if (S.sec === 'overlay') ovSet('idle'); return; }
  if (d.ov) { stopT(); ovSet(d.ov); return; }
  if (d.ovo) { OV[d.ovo] = d.ovo==='pos' ? (OV.pos==='top'?'bottom':'top') : !OV[d.ovo]; render(); if (d.ovo==='glow' && OV.glow) playReq(); return; }
  if (d.ovf) { OV.frame = d.ovf; OV.cu = true; render(); return; }
  if (el.id === 'ovPlay') { playReq(); return; }
  if (d.onbnav) { onbDir = +d.onbnav; S.onb = Math.max(0, Math.min(ONB.length-1, S.onb + +d.onbnav)); render(); return; }
  if (d.finish !== undefined) { S.onb = 0; S.sec = 'cc'; S.page = 'home'; render(); window.scrollTo(0,0); toast('KIVO is ready. Say “Hey Kivo”'); return; }
  if (d.obtry !== undefined) { playMini(); return; }
  if (d.refresh !== undefined) { const w = el.closest('.rf'); w.classList.add('busy'); setTimeout(() => { w.classList.remove('busy'); w.firstChild.textContent = 'Checked just now '; }, 900); return; }
  if (d.act === 'tog') { el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); return; }
  if (d.act === 'seg') { el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (d.act === 'opt') { el.parentElement.querySelectorAll('.option').forEach(b => { b.setAttribute('aria-pressed', b === el); b.querySelector('.rad')?.classList.toggle('on', b === el); }); return; }
});
scrim.addEventListener('click', e => { if (e.target === scrim) closeOverlay(); });
document.addEventListener('input', e => { if (e.target.id === 'palIn') document.getElementById('palList').innerHTML = palList(e.target.value); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { closeOverlay(); closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'palIn') { const s = document.querySelector('.pi.sel[data-pal]'); if (s) runPal(s.dataset.pal); else closeOverlay(); }
  if (e.key === 'Enter' && e.target.matches('.side a, [data-palette]')) e.target.click();
});
if (PARENT[S.page]) goTo(S.page);
sysDark.addEventListener('change', () => { if (S.themePref === 'system') render(); });
render();
})();
</script>
</body>
</html>
