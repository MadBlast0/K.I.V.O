<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIVO App Mockup</title>
<style>
/* ═════════════════════ Tokens ═════════════════════ */
:root{
  --sys:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --spring:cubic-bezier(.32,1.28,.54,1); --out:cubic-bezier(.2,.8,.2,1);
  --r-ctl:8px; --r-card:12px; --r-win:10px;
  --pad:16px; --rowh:44px;
  --island:#000; --island-2:#141414; --island-fg:#fff; --island-fg2:rgba(255,255,255,.6);
  --ok:#1E9E6A; --warn:#C98A00; --danger:#D6453D;
}
[data-theme="light"]{
  --stage:#E4E3DE; --win:#F5F5F3; --side:#EDEDEA; --panel:#FFFFFF; --panel-2:#F6F6F4; --hover:rgba(0,0,0,.045); --line:rgba(0,0,0,.085); --line-2:rgba(0,0,0,.14);
  --text:#161615; --text-2:#5D5C58; --text-3:#8D8C86; --ink:#111; --ink-fg:#fff; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --stage:#0F0F0E; --win:#1C1C1B; --side:#171716; --panel:#232322; --panel-2:#2A2A28; --hover:rgba(255,255,255,.055); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#F1F0EC; --text-2:#AEACA5; --text-3:#7D7B75; --ink:#F1F0EC; --ink-fg:#111; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --ok:#3CC98E; --warn:#E7B53C; --danger:#F06A61;
}
[data-accent="blue"]{--acc:#2F6BFF;--acc-soft:rgba(47,107,255,.12)}
[data-accent="green"]{--acc:#12925E;--acc-soft:rgba(18,146,94,.12)}
[data-accent="coral"]{--acc:#E2572F;--acc-soft:rgba(226,87,47,.12)}
[data-accent="mono"]{--acc:#6B6B6B;--acc-soft:rgba(107,107,107,.14)}
[data-theme="dark"][data-accent="blue"]{--acc:#7FA6FF;--acc-soft:rgba(127,166,255,.14)}
[data-theme="dark"][data-accent="green"]{--acc:#49C996;--acc-soft:rgba(73,201,150,.14)}
[data-theme="dark"][data-accent="coral"]{--acc:#FF8A66;--acc-soft:rgba(255,138,102,.14)}
[data-theme="dark"][data-accent="mono"]{--acc:#C9C9C9;--acc-soft:rgba(201,201,201,.12)}
[data-density="compact"]{--pad:12px;--rowh:36px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--text);font-family:var(--sys);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═════════════════════ Viewer chrome ═════════════════════ */
.viewer{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--stage) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.vin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.vbrand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:15px;margin-right:auto}
.vbrand .dot{width:22px;height:22px;border-radius:50%;background:#000;display:grid;place-items:center}
.vbrand .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 15%,#9AD3FF 35%,#3A6DFF 75%)}
.vbrand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--text-3)}
.vtabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:10px}
.vtabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:13px}
.vtabs button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.vopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vopt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.vopt select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12.5px}
.sw{display:flex;gap:4px}
.sw button{width:18px;height:18px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--text)}
.page{max-width:1320px;margin:0 auto;padding:22px 16px 80px}
.intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:14px}
.intro h1{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.intro p{margin:4px 0 0;color:var(--text-2);max-width:760px}
.tagline{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.06em}

/* ═════════════════════ Components ═════════════════════ */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2)}
.btn.ink{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.btn.ink:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn:focus-visible,.tog:focus-visible,.seg button:focus-visible,.nav a:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.input{height:34px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--panel);padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--text-3)}
.input input{border:0;outline:0;background:transparent;flex:1;color:var(--text);min-width:0}
.input:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;color:var(--text);width:100%}
.tog{width:40px;height:22px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);position:relative;flex:none;padding:0;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text-3);transition:transform .25s var(--spring),background .2s}
.tog[aria-checked="true"]{background:var(--acc);border-color:transparent}
.tog[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--text-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--hover);color:var(--text-2);white-space:nowrap}
.chip.local{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.cloud{color:var(--acc);background:var(--acc-soft)}
.chip.costly{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.sens{color:#A45BD6;background:rgba(164,91,214,.12)}
[data-theme="dark"] .chip.sens{color:#C99BEA}
.chip.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.dotc{width:7px;height:7px;border-radius:50%;background:currentColor}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text-2);background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card)}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px var(--pad);border-bottom:1px solid var(--line)}
.card .ch h3{margin:0;font-size:13.5px;font-weight:600}
.card .cb{padding:var(--pad)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:var(--rowh);padding:6px var(--pad);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:500}
.row .t2{font-size:12.5px;color:var(--text-2)}
.row .meta{font-family:var(--mono);font-size:11.5px;color:var(--text-3);white-space:nowrap}
.ic-box{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);flex:none}
.mono-logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.meter{height:6px;border-radius:6px;background:var(--hover);overflow:hidden}
.meter span{display:block;height:100%;background:var(--acc);border-radius:6px}
.orb{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#9AD3FF 32%,#3A6DFF 70%,#1B1F6B);box-shadow:0 0 14px rgba(120,170,255,.55)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--acc);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.okdot{width:16px;height:16px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.okdot svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4}
.empty{padding:28px;text-align:center;color:var(--text-2)}
.empty .ic-box{margin:0 auto 10px;width:40px;height:40px}
h2.pt{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.ps{color:var(--text-2);margin:2px 0 0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-7-5{grid-template-columns:7fr 5fr}
.lbl{font-size:12px;font-weight:600;color:var(--text-2);margin:18px 0 8px;text-transform:none}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.kv span:first-child{color:var(--text-2)}
.stat .v{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--text-3)}
.tier{border:1px solid var(--line);border-radius:var(--r-card);padding:14px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px}
.tier[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.tier .nm{font-weight:600}
.tier .d{font-size:12.5px;color:var(--text-2)}
.bars{display:flex;gap:2px}
.bars i{width:14px;height:5px;border-radius:3px;background:var(--line-2)}
.bars i.on{background:var(--text)}
.note{font-size:12.5px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt-note{border:1px dashed var(--acc);background:var(--acc-soft);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}

/* ═════════════════════ Control Center window ═════════════════════ */
.win{border-radius:var(--r-win);overflow:hidden;background:var(--win);border:1px solid var(--line-2);box-shadow:0 30px 70px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;height:760px}
.titlebar{height:36px;display:flex;align-items:center;justify-content:space-between;padding-left:12px;font-size:12px;color:var(--text-2);flex:none;-webkit-user-select:none;user-select:none}
.titlebar .tl{display:flex;align-items:center;gap:8px}
.titlebar .wctl{display:flex;height:100%}
.titlebar .wctl span{width:46px;display:grid;place-items:center;font-size:11px;color:var(--text-2)}
.titlebar .wctl span:hover{background:var(--hover)}
.titlebar .wctl span:last-child:hover{background:#C42B1C;color:#fff}
.body{flex:1;display:flex;min-height:0}
.nav{width:232px;flex:none;padding:6px 10px 12px;display:flex;flex-direction:column;gap:1px;overflow:auto;background:var(--side)}
.nav .srch{margin:4px 2px 10px}
.nav .grp{font-size:11.5px;font-weight:600;color:var(--text-3);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:13px;cursor:pointer;position:relative}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav a.on::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc)}
.nav a .badge{margin-left:auto;font-size:11px;color:var(--text-3)}
.nav .foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.nav .foot .st{font-size:12px;color:var(--text-2);line-height:1.3}
.content{flex:1;min-width:0;overflow:auto;padding:22px 26px 40px;background:var(--win)}
/* layout: rail */
[data-layout="rail"] .nav{width:64px;align-items:center;padding:6px 8px}
[data-layout="rail"] .nav .srch,[data-layout="rail"] .nav .grp,[data-layout="rail"] .nav a span.txt,[data-layout="rail"] .nav a .badge,[data-layout="rail"] .nav .foot .st{display:none}
[data-layout="rail"] .nav a{width:44px;justify-content:center;padding:0}
[data-layout="rail"] .nav .grp + a{margin-top:10px}
/* layout: tabs */
.topnav{display:none}
[data-layout="tabs"] .nav{display:none}
[data-layout="tabs"] .body{flex-direction:column}
[data-layout="tabs"] .topnav{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow:auto;flex:none;background:var(--side)}
.topnav a{padding:10px 12px;font-size:13px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.topnav a.on{color:var(--text);border-color:var(--acc)}
.topnav .more{margin-left:auto}

/* chat */
.chatwrap{display:grid;grid-template-columns:220px 1fr;gap:0;height:100%;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--panel)}
.threads{border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--panel-2)}
.threads a{padding:8px 10px;border-radius:8px;cursor:pointer}
.threads a.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.threads a b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.threads a small{color:var(--text-3);font-size:11.5px}
.conv{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.m-you{align-self:flex-end;max-width:70%;background:var(--ink);color:var(--ink-fg);padding:9px 14px;border-radius:18px 18px 6px 18px}
.m-k{max-width:78%;display:flex;gap:10px}
.m-k .orb{width:22px;height:22px;flex:none;margin-top:2px}
.m-k .bub p{margin:0 0 6px}
.toolrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin:4px 0}
.composer{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
.composer .input{flex:1;height:38px;border-radius:999px}
.meta-line{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}

/* routine builder */
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--text-3);width:18px}
.connector{height:14px;width:2px;background:var(--line-2);margin-left:21px}
/* usage chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.chart .b i{display:block;border-radius:3px 3px 0 0;background:var(--acc)}
.chart .b i.s2{background:color-mix(in srgb,var(--acc) 45%,transparent);border-radius:0}
.chart .b span{font-size:10px;color:var(--text-3);text-align:center;font-family:var(--mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* home minimal */
.hero-min{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 0 20px}
.hero-min .orb{width:88px;height:88px;margin-bottom:18px}
.hero-min h2{font-family:var(--disp);font-size:28px;font-weight:600;margin:0}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.scrim.on{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--win);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal .mh{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .mh h3{margin:0;font-family:var(--disp);font-size:18px}
.modal .mb{padding:14px 20px}
.modal .mf{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:var(--side)}
.quality{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.recs{display:flex;gap:8px}
.recs span{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--text-3);font-size:12px}
.recs span.done{border:0;background:var(--ok);color:#fff}

/* ═════════════════════ Desktop stage + Island ═════════════════════ */
.stage{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;isolation:isolate;container-type:inline-size;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.stage .wall{position:absolute;inset:0;z-index:-2}
[data-theme="light"] .stage .wall{background:radial-gradient(60% 80% at 78% 30%,#CBD9E6,transparent 60%),radial-gradient(70% 70% at 10% 90%,#E8D9C8,transparent 60%),linear-gradient(160deg,#EEF1F4,#DCE3EA 55%,#E9E2D9)}
[data-theme="dark"] .stage .wall{background:radial-gradient(60% 80% at 78% 25%,#2A3A4E,transparent 60%),radial-gradient(70% 70% at 10% 95%,#3A2E27,transparent 60%),linear-gradient(160deg,#15181D,#1B2129 55%,#1E1A17)}
.dapp{position:absolute;left:9%;top:9%;width:62%;height:72%;border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--line),0 18px 50px -18px rgba(0,0,0,.35)}
.dapp .tb{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2)}
.dapp .tb i{height:22px;width:140px;border-radius:7px 7px 0 0;background:var(--panel-2);display:block}
.dapp .dc{padding:3cqw 5cqw}
.dapp .dc h4{font-family:var(--disp);font-size:max(14px,2cqw);margin:0 0 .8cqw}
.dapp .dc p{margin:0 0 1cqw;font-size:max(10px,1.15cqw);color:var(--text-2);line-height:1.6}
.dtask{position:absolute;left:0;right:0;bottom:0;height:5.6%;display:flex;align-items:center;justify-content:center;gap:.8cqw;backdrop-filter:blur(20px);background:color-mix(in srgb,var(--panel) 82%,transparent);border-top:1px solid var(--line)}
.dtask i{width:2.1cqw;height:2.1cqw;border-radius:.45cqw;background:var(--line-2)}
.dtask .ck{position:absolute;right:1.2cqw;font-size:max(9px,.9cqw);text-align:right;line-height:1.2;color:var(--text-2)}
.dtask .trayk{position:absolute;right:6.2cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#000;display:grid;place-items:center}

let amp = 0, t = 0, raf = null;
const loud = () => ['listening','speaking','media'].includes(OV.state);
const tick = () => {
  t += 1/60; const target = loud() ? .35 + .65*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.7+1) + .25*Math.sin(t*9)) : 0;
  amp += (target - amp) * .12;
  const c = document.getElementById('ovWave');
  if (c) { const x = c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
    for (let i=0;i<5;i++){ const h = 6 + (c.height-8)*Math.max(.08, amp*(.5+.5*Math.abs(Math.sin(t*6+i*1.3))));
      x.fillStyle = OV.state==='speaking' ? '#9AD3FF' : '#fff'; x.beginPath(); x.roundRect(6+i*17,(c.height-h)/2,8,h,4); x.fill(); } }
  if (S.sec !== 'overlay' || (!loud() && amp < .003)) { raf = null; return; }   // zero frames at rest
  raf = requestAnimationFrame(tick);
};
const kick = () => { if (!raf && !matchMedia('(prefers-reduced-motion: reduce)').matches) raf = requestAnimationFrame(tick); };

  ['Your voice', () => `<h2>Teach KIVO your voice</h2><p class="sub">8 short phrases help KIVO recognize you and your accent. Stored encrypted on this PC only. You can delete them any time.</p>
    <div class="phrase">“Hey Kivo, open my projects folder”</div>
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="recs">${[1,2,3,4,5,6,7,8].map(i=>`<span class="${i<4?'done':''}">${i<4?'✓':i}</span>`).join('')}</div><button class="btn ink">${I('mic')}Record phrase 4</button></div>`],
  ['Brain', () => `<h2>Choose how KIVO thinks</h2><p class="sub">Sign in with something you already use. No API keys needed. You can also skip this and only use local commands.</p>
    ${card('', `<div class="rows" style="margin:-16px">${row(logo('CC','#C96442'),'Claude Code','Found on this PC · use your Claude sign-in',`<button class="btn sm ink">Connect</button>`)}${row(logo('OR','#4B4BD6'),'OpenRouter','One sign-in, many models',`<button class="btn sm ink">Connect</button>`)}${row(logo('OL','#222'),'Ollama','Found on this PC · fully local',chip('Detected','local') + `<button class="btn sm">Use</button>`)}${row(icb('clock'),'Decide later','Local commands still work','<button class="btn sm ghost">Skip</button>')}</div>`)}`],
  ['Permissions', () => `<h2>How careful should KIVO be?</h2><p class="sub">High-risk actions, such as deleting, sending or paying, always ask, whichever you pick.</p>
    <div class="grid g3">${[['Maximum safety','Asks before any change'],['Balanced','Asks before changes it hasn’t done before',true],['Power user','Asks only for risky actions']].map(([n,d,r]) => `<button class="tier" aria-pressed="${!!r}" data-act="tier"><span class="nm">${n}</span><span class="d">${d}</span></button>`).join('')}</div>`],
  ['Look & sounds', () => `<h2>The Island</h2><p class="sub">It appears at the top of your screen when you talk to KIVO, and disappears when it’s done.</p>
    <div style="display:flex;justify-content:center;padding:18px;background:var(--panel-2);border-radius:12px;border:1px solid var(--line)"><div class="island isl show" data-sheet="speaking" style="position:static;transform:none"></div></div>
    ${card('', `<div class="rows" style="margin:-16px">${row(icb('wave'),'Listening sounds','',tog(true,'Sounds'))}${row(icb('sparkle'),'Wake glow','',tog(false,'Glow'))}</div>`)}`],
  ['Startup', () => `<h2>Starting and closing</h2><p class="sub">For “Hey Kivo” to work, KIVO needs to keep running in the background. It uses about 1% CPU.</p>
    ${card('', `<div class="rows" style="margin:-16px">${row(icb('power'),'Start KIVO when I sign in','',tog(false,'Start'))}${row(icb('window'),'Keep running when I close the window','KIVO stays in the system tray. Quit from the tray icon',tog(true,'Keep running'))}</div>`)}`],
  ['Try it', () => `<h2>You’re all set</h2><p class="sub">Try it now. Say:</p><div class="phrase">“Hey Kivo, what time is it?”</div>
    <div style="display:flex;justify-content:center"><div class="island isl show" data-sheet="listening" style="position:static;transform:none"></div></div>`]
];
const onbHTML = () => `<div class="intro"><div><div class="tagline">ONBOARDING · FIRST LAUNCH</div><h1>Setup, in 12 short steps</h1><p>Every step has a recommended default and can be skipped. Click the steps on the left, or use Back and Continue.</p></div></div>
  <div class="onb"><div class="steps">${ONB.map(([n],i) => `<div class="s ${i<S.onb?'done':i===S.onb?'on':''}" data-onb="${i}"><span class="n">${i<S.onb?'✓':i+1}</span>${n}</div>`).join('')}</div>
  <div class="main"><div class="oc">${ONB[S.onb][1]()}</div><div class="of"><button class="btn ghost" data-onbnav="-1" ${S.onb===0?'disabled':''}>Back</button><span class="meta-line">${S.onb+1} / ${ONB.length}</span><div style="display:flex;gap:8px"><button class="btn ghost" data-onbnav="1">Skip</button><button class="btn ink" data-onbnav="1">${S.onb===ONB.length-1?'Finish':'Continue'}</button></div></div></div></div>`;

/* ═════════════════════ System surfaces ═════════════════════ */
const sysHTML = () => `<div class="intro"><div><div class="tagline">SYSTEM SURFACES</div><h1>Tray, notifications and safety prompts</h1><p>What KIVO shows outside its own window.</p></div></div>
  <div class="surf">
    <div class="cell"><span class="cap">Tray menu (right-click)</span><div class="traymenu">
      <div class="mi"><b>Open KIVO</b></div><div class="mi">${I('pause')}Pause listening<span class="k">Ctrl Alt P</span></div><div class="mi">${I('eye')}Hide Island for 1 hour</div><hr>
      <div class="mi" style="color:var(--danger)">${I('stop')}Stop everything<span class="k">Ctrl Alt Shift Esc</span></div><hr><div class="mi">${I('gear')}Settings</div><div class="mi">${I('power')}Quit KIVO</div></div></div>
    <div class="cell"><span class="cap">First time you close the window</span><div class="toast"><div class="th"><span class="ik"></span>KIVO</div><b>KIVO is still running</b>Say “Hey Kivo” or press Ctrl + Space any time. Quit from the tray icon.<div class="ta"><button class="btn">Settings</button><button class="btn">Quit KIVO</button></div></div></div>
    <div class="cell"><span class="cap">Task finished (you were in a call, so no speech)</span><div class="toast"><div class="th"><span class="ik"></span>KIVO · 2 min ago</div><b>Tests fixed</b>Codex changed 2 files. All 48 tests pass.<div class="ta"><button class="btn">View changes</button><button class="btn">Dismiss</button></div></div></div>
    <div class="cell"><span class="cap">Budget warning</span><div class="toast"><div class="th"><span class="ik"></span>KIVO</div><b>80% of your monthly AI budget used</b>$8.02 of $10.00. At the limit KIVO will ask you before using cloud AI.<div class="ta"><button class="btn">Open Usage</button><button class="btn">OK</button></div></div></div>
    <div class="cell"><span class="cap">High-risk confirmation (Windows Hello)</span><div class="hello"><div style="font-weight:600">KIVO wants to send an email</div><div class="face">${I('user')}</div><div style="font-size:13px;color:var(--text-2)">To maya@studio.com: “Design review moved to Thursday”</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1;justify-content:center;border-radius:6px">Cancel</button><button class="btn ink" style="flex:1;justify-content:center;border-radius:6px">Use PIN</button></div></div></div>
    <div class="cell"><span class="cap">Capability turned off (shown in the Island)</span><div class="island isl show" style="position:static;transform:none;width:460px;height:112px;border-radius:26px"><div class="irow"><span class="orb"></span><span class="il">Screen awareness is off</span></div><div class="ibody" style="opacity:1">To answer “what’s on my screen?”, KIVO needs Screen awareness.<div class="ibtns"><span class="p">Turn on</span><span>Not now</span></div></div></div></div>
  </div>`;

/* ═════════════════════ Components ═════════════════════ */
const compHTML = () => {
  const tk = [['--ink','Ink (primary)'],['--acc','Accent'],['--island','Island'],['--panel','Panel'],['--win','Window'],['--side','Sidebar'],['--ok','Success'],['--warn','Warning'],['--danger','Danger']];
  const c = (t, body, spec) => `<div class="card"><div class="ch"><h3>${t}</h3></div><div class="cb">${body}</div><div class="spec">${spec}</div></div>`;
  return `<div class="intro"><div><div class="tagline">COMPONENT LIBRARY</div><h1>Every building block</h1><p>These re-theme with the options at the top. Each block says which base it comes from: shadcn/ui on Base UI, custom, or adapted from ElevenLabs UI.</p></div></div>
  <div class="lbl" style="margin-top:0">Color tokens</div><div class="tokens">${tk.map(([v,n]) => `<div class="tok"><i style="background:var(${v})"></i><div>${n}<small>${v}</small></div></div>`).join('')}</div>
  <div class="lbl">Type</div>${card('', `<div style="font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.015em">Display 28 · Segoe UI Variable Display</div><div style="font-family:var(--disp);font-size:20px;font-weight:600">Title 20</div><div style="font-size:14px">Body 14 · Segoe UI Variable Text. The quick brown fox, खुश रहो, ਸਤ ਸ੍ਰੀ ਅਕਾਲ</div><div style="font-size:12.5px;color:var(--text-2)">Secondary 12.5</div><div style="font-family:var(--mono);font-size:12px;color:var(--text-3)">Mono 12 · Cascadia Mono · 142 ms</div>`)}
  <div class="lbl">Controls</div><div class="gal">
    ${c('Buttons', `<button class="btn ink">${I('mic')}Primary</button><button class="btn">Secondary</button><button class="btn ghost">Ghost</button><button class="btn danger">Danger</button><button class="btn sm">Small</button><button class="btn icon" aria-label="Add">${I('plus')}</button>`, 'shadcn Button · pill radius · ink = primary')}
    ${c('Toggle', `${tog(true,'On')} ${tog(false,'Off')}`, 'Base UI Switch · spring thumb')}
    ${c('Segmented', seg(['Stable','Beta','Experimental'],'Stable'), 'Base UI ToggleGroup')}
    ${c('Inputs', `<div class="input" style="width:100%">${I('search')}<input placeholder="Search"></div><div class="input" style="width:140px">$<input value="10.00"></div>`, 'shadcn Input')}
    ${c('Keyboard keys', `<span class="kbd">Ctrl</span><span class="kbd">Space</span> <span class="kbd">Ctrl</span><span class="kbd">Alt</span><span class="kbd">Shift</span><span class="kbd">Esc</span>`, 'custom · also used for shortcut recorder')}
    ${c('Chips / badges', chip('Local','local')+chip('Cloud','cloud')+chip('Costly','costly')+chip('Sensitive','sens')+chip('Risky','bad')+chip('Neutral'), 'custom · always text + color')}
    ${c('Status', `<span class="spin"></span> Running &nbsp; <span class="okdot">${I('check')}</span> Done &nbsp; <div class="meter" style="width:120px"><span style="width:62%"></span></div>`, 'custom spinner · Base UI Progress')}
    ${c('Selection card (tier)', `<div class="grid g2" style="width:100%"><button class="tier" aria-pressed="true" data-act="tier"><span class="nm">Fast</span><span class="d">Moonshine · local</span></button><button class="tier" aria-pressed="false" data-act="tier"><span class="nm">Cloud</span><span class="d">Deepgram</span></button></div>`, 'Base UI RadioGroup styled as cards')}
    ${c('List row', `<div class="rows" style="width:100%;margin:-16px">${row(icb('mic'),'Hey Kivo','Built-in · trained model',chip('Good','local')+tog(true,'x'))}</div>`, 'custom Row: icon · title · subtitle · trailing')}
    ${c('Connector tile', `<div style="display:flex;gap:10px;align-items:center;width:100%">${logo('GC','#1A73E8')}<div style="flex:1"><b>Google Calendar</b><div style="font-size:12px;color:var(--text-2)">Sign in with Google</div></div><button class="btn sm ink">Connect</button></div>`, 'custom Card')}
    ${c('Confirmation (in app)', `<div class="note" style="width:100%;border-color:color-mix(in srgb,var(--warn) 45%,transparent)"><b style="color:var(--warn)">Needs your OK · Medium risk</b><br>Edit src/main.rs<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm ink">Allow once</button><button class="btn sm">Always…</button><button class="btn sm danger">Deny</button></div></div>`, 'custom · never auto-dismisses')}
    ${c('Island', `<div class="island isl show" data-sheet="listening" style="position:static;transform:none"></div>`, 'custom Island shell · the waveform is adapted from ElevenLabs bar-visualizer')}
    ${c('Chat bubbles', `<div style="display:flex;flex-direction:column;gap:8px;width:100%"><div class="m-you" style="max-width:90%">Why is my build failing?</div><div class="toolrow">${I('term')}Ran cargo check · 1 error</div></div>`, 'adapted from ElevenLabs message/conversation')}
    ${c('Empty state', `<div class="empty" style="width:100%"><span class="ic-box">${I('routine')}</span><b>No routines yet</b><div style="font-size:12.5px">Say “Kivo, create a routine…” or start from a template.</div></div>`, 'custom')}
    ${c('Dialog', `<button class="btn" data-modal="wake">Open “Add wake word”</button> <button class="btn" data-modal="routine">Open “New routine”</button>`, 'Base UI Dialog')}
    ${c('Toast', `<div class="toast" style="width:100%"><div class="th"><span class="ik"></span>KIVO</div><b>Tests fixed</b>All 48 tests pass.</div>`, 'Windows toast (system) · in-app Sonner-style')}
  </div>`;
};

/* ═════════════════════ Modals ═════════════════════ */
const MODALS = {
  wake: () => `<div class="mh"><div><h3>Add a wake word</h3><div style="color:var(--text-2);font-size:13px">Type it, check it, record it: done in about a minute.</div></div><button class="btn icon ghost" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb"><div class="lbl" style="margin-top:0">Phrase</div><div class="input">${I('mic')}<input value="Okay Jarvis"></div>
    <div class="quality" style="margin-top:10px"><span class="okdot">${I('check')}</span><div style="flex:1"><b>Good choice</b><div style="font-size:12.5px;color:var(--text-2)">4 syllables · distinctive sounds · no clash with commands or other wake words</div></div><button class="btn sm">${I('play')}Hear it</button></div>
    <div class="lbl">Record 5 samples <span style="font-weight:400;color:var(--text-3)">(it already works without them, and they make it more accurate)</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="recs">${[1,2,3,4,5].map(i=>`<span class="${i<3?'done':''}">${i<3?'✓':i}</span>`).join('')}</div><button class="btn ink">${I('mic')}Record 3</button></div>
    <div class="lbl">Sensitivity</div><input type="range" min="0" max="100" value="50" style="width:100%;accent-color:var(--acc)" aria-label="Sensitivity"><div class="kv" style="font-size:12px"><span>Fewer false wakes</span><span>Wakes more easily</span></div>
    <div class="note" style="margin-top:10px">False-wake test on 10 minutes of background speech: <b>0 false wakes</b> ✓</div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn ink" data-close>Add wake word</button></div>`,
  routine: () => `<div class="mh"><div><h3>New routine</h3><div style="color:var(--text-2);font-size:13px">Start from a template, or describe it.</div></div><button class="btn icon ghost" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb"><div class="input">${I('sparkle')}<input value="When I say work mode, open VS Code and Slack and turn on Focus"></div>
    <div style="font-size:12px;color:var(--text-3);margin:6px 0 14px">KIVO drafts the steps. You review them before saving.</div>
    <div class="lbl" style="margin-top:0">Or start from</div><div class="grid g2">${[['Work mode','Open apps + Focus'],['Focus timer','Timer + Do Not Disturb'],['Meeting','Mute, headset, calendar link'],['Goodnight','Close apps, sleep (asks)']].map(([a,b]) => `<button class="tier" aria-pressed="false" data-act="tier"><span class="nm">${a}</span><span class="d">${b}</span></button>`).join('')}</div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn ink" data-close>Continue</button></div>`
};

/* ═════════════════════ Render + events ═════════════════════ */
const page = document.getElementById('page');
const render = () => {
  applyRoot(); save();
  document.querySelectorAll('#secTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === S.sec));
  document.querySelectorAll('#oAccent button').forEach(b => b.setAttribute('aria-pressed', b.dataset.acc === S.accent));
  ['oTheme','oLayout','oHome','oDensity'].forEach((id,i) => document.getElementById(id).value = [S.theme,S.layout,S.home,S.density][i]);
  page.innerHTML = { overlay:overlayHTML, cc:ccHTML, onb:onbHTML, sys:sysHTML, comp:compHTML }[S.sec]();
  const isl = document.getElementById('ovIsland'); if (isl) { renderIsland(isl, OV, 'ovWave'); kick(); }
  document.querySelectorAll('[data-sheet]').forEach(el => renderIsland(el, { state: el.dataset.sheet, partial: el.dataset.sheet==='listening' ? 'Play something calm on Spotify' : '' }));
};
const ovSet = (state, partial) => { OV.state = state; if (partial !== undefined) OV.partial = partial; else if (state==='listening') OV.partial = 'Play something calm on Spotify and';
  const isl = document.getElementById('ovIsland'); if (!isl) return; renderIsland(isl, OV, 'ovWave');
  document.querySelectorAll('[data-ov]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ov === state)); kick(); };
let timers = []; const stopT = () => { timers.forEach(clearTimeout); timers = []; }; const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const playReq = () => {
  stopT(); ovSet('idle');
  if (OV.glow) { at(120, () => { const g = document.getElementById('glow'); g && g.classList.add('on'); }); at(650, () => { const g = document.getElementById('glow'); g && g.classList.remove('on'); }); }
  at(250, () => ovSet('listening',''));
  const w = REQ.split(' '); let acc = ''; w.forEach((x,i) => at(700 + i*220, () => { acc += (i?' ':'') + x; ovSet('listening', acc); }));
  let T = 700 + w.length*220 + 350;
  at(T, () => ovSet('thinking')); at(T += 900, () => ovSet('acting')); at(T += 1500, () => ovSet('speaking')); at(T += 3200, () => ovSet('media')); at(T += 3500, () => ovSet('idle'));
};

document.addEventListener('click', e => {
  const el = e.target.closest('button,a,[data-onb]'); if (!el) return;
  const d = el.dataset;
  if (d.sec) { stopT(); S.sec = d.sec; render(); window.scrollTo(0,0); return; }
  if (d.acc) { S.accent = d.acc; render(); return; }
  if (d.go) { S.sec = 'cc'; S.page = d.go; render(); return; }
  if (d.ov) { stopT(); ovSet(d.ov); return; }
  if (d.ovopt) { if (d.ovopt==='pos') OV.pos = OV.pos==='top'?'bottom':'top'; else OV[d.ovopt] = !OV[d.ovopt]; render(); if (d.ovopt==='glow' && OV.glow) playReq(); return; }
  if (el.id === 'ovPlay') { playReq(); return; }
  if (d.onb !== undefined) { S.onb = +d.onb; render(); return; }
  if (d.onbnav) { S.onb = Math.max(0, Math.min(ONB.length-1, S.onb + +d.onbnav)); render(); return; }
  if (d.modal) { document.getElementById('modal').innerHTML = MODALS[d.modal](); document.getElementById('scrim').classList.add('on'); return; }
  if (d.close !== undefined) { document.getElementById('scrim').classList.remove('on'); return; }
  if (d.act === 'tog') { el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); return; }
  if (d.act === 'seg') { el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (d.act === 'tier') { el.parentElement.querySelectorAll('.tier').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
});
document.getElementById('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') e.currentTarget.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('scrim').classList.remove('on');
  if (e.key === 'Enter' && e.target.matches('.nav a')) e.target.click(); });
[['oTheme','theme'],['oLayout','layout'],['oHome','home'],['oDensity','density']].forEach(([id,k]) => document.getElementById(id).addEventListener('change', e => { S[k] = e.target.value; if (k==='home') { S.sec='cc'; S.page='home'; } if (k==='layout') S.sec='cc'; render(); }));
render();
})();
</script>
</body>
</html>
