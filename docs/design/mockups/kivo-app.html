<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIVO App Mockup</title>
<style>
/* ═════════════════════ Tokens ═════════════════════ */
:root{
  --sys:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --spring:cubic-bezier(.32,1.28,.54,1); --out:cubic-bezier(.2,.8,.2,1);
  --r-ctl:8px; --r-card:12px; --r-win:10px;
  --pad:16px; --rowh:44px;
  --island:#000; --island-2:#141414; --island-fg:#fff; --island-fg2:rgba(255,255,255,.6);
  --ok:#1E9E6A; --warn:#C98A00; --danger:#D6453D;
}
[data-theme="light"]{
  --stage:#E4E3DE; --win:#F5F5F3; --side:#EDEDEA; --panel:#FFFFFF; --panel-2:#F6F6F4; --hover:rgba(0,0,0,.045); --line:rgba(0,0,0,.085); --line-2:rgba(0,0,0,.14);
  --text:#161615; --text-2:#5D5C58; --text-3:#8D8C86; --ink:#111; --ink-fg:#fff; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --stage:#0F0F0E; --win:#1C1C1B; --side:#171716; --panel:#232322; --panel-2:#2A2A28; --hover:rgba(255,255,255,.055); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#F1F0EC; --text-2:#AEACA5; --text-3:#7D7B75; --ink:#F1F0EC; --ink-fg:#111; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --ok:#3CC98E; --warn:#E7B53C; --danger:#F06A61;
}
[data-accent="blue"]{--acc:#2F6BFF;--acc-soft:rgba(47,107,255,.12)}
[data-accent="green"]{--acc:#12925E;--acc-soft:rgba(18,146,94,.12)}
[data-accent="coral"]{--acc:#E2572F;--acc-soft:rgba(226,87,47,.12)}
[data-accent="mono"]{--acc:#6B6B6B;--acc-soft:rgba(107,107,107,.14)}
[data-theme="dark"][data-accent="blue"]{--acc:#7FA6FF;--acc-soft:rgba(127,166,255,.14)}
[data-theme="dark"][data-accent="green"]{--acc:#49C996;--acc-soft:rgba(73,201,150,.14)}
[data-theme="dark"][data-accent="coral"]{--acc:#FF8A66;--acc-soft:rgba(255,138,102,.14)}
[data-theme="dark"][data-accent="mono"]{--acc:#C9C9C9;--acc-soft:rgba(201,201,201,.12)}
[data-accent="violet"]{--acc:#6E56CF;--acc-soft:rgba(110,86,207,.12)}
[data-accent="teal"]{--acc:#0E8A8A;--acc-soft:rgba(14,138,138,.12)}
[data-accent="amber"]{--acc:#B7700B;--acc-soft:rgba(183,112,11,.13)}
[data-theme="dark"][data-accent="violet"]{--acc:#A898F0;--acc-soft:rgba(168,152,240,.14)}
[data-theme="dark"][data-accent="teal"]{--acc:#4FC9C9;--acc-soft:rgba(79,201,201,.14)}
[data-theme="dark"][data-accent="amber"]{--acc:#F0B24A;--acc-soft:rgba(240,178,74,.14)}
[data-textsize="large"] body{font-size:15.5px}
[data-density="compact"]{--pad:12px;--rowh:36px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stage);color:var(--text);font-family:var(--sys);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═════════════════════ Viewer chrome ═════════════════════ */
.viewer{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--stage) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.vin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.vbrand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:15px;margin-right:auto}
.vbrand .dot{width:22px;height:22px;border-radius:50%;background:#000;display:grid;place-items:center}
.vbrand .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 15%,#9AD3FF 35%,#3A6DFF 75%)}
.vbrand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--text-3)}
.vtabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:10px}
.vtabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:13px}
.vtabs button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.vopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vopt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.vopt select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12.5px}
.sw{display:flex;gap:4px}
.sw button{width:18px;height:18px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--text)}
.page{max-width:1320px;margin:0 auto;padding:22px 16px 80px}
.intro{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:14px}
.intro h1{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.intro p{margin:4px 0 0;color:var(--text-2);max-width:760px}
.tagline{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:.06em}

/* ═════════════════════ Components ═════════════════════ */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2)}
.btn.ink{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.btn.ink:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 10px;font-size:12px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn:focus-visible,.tog:focus-visible,.seg button:focus-visible,.nav a:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.input{height:34px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--panel);padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--text-3)}
.input input{border:0;outline:0;background:transparent;flex:1;color:var(--text);min-width:0}
.input:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;color:var(--text);width:100%}
.tog{width:40px;height:22px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);position:relative;flex:none;padding:0;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text-3);transition:transform .25s var(--spring),background .2s}
.tog[aria-checked="true"]{background:var(--acc);border-color:transparent}
.tog[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.seg{display:inline-flex;background:var(--hover);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--text-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--hover);color:var(--text-2);white-space:nowrap}
.chip.local{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.cloud{color:var(--acc);background:var(--acc-soft)}
.chip.costly{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.sens{color:#A45BD6;background:rgba(164,91,214,.12)}
[data-theme="dark"] .chip.sens{color:#C99BEA}
.chip.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.dotc{width:7px;height:7px;border-radius:50%;background:currentColor}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text-2);background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card)}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px var(--pad);border-bottom:1px solid var(--line)}
.card .ch h3{margin:0;font-size:13.5px;font-weight:600}
.card .cb{padding:var(--pad)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:var(--rowh);padding:6px var(--pad);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:500}
.row .t2{font-size:12.5px;color:var(--text-2)}
.row .meta{font-family:var(--mono);font-size:11.5px;color:var(--text-3);white-space:nowrap}
.ic-box{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);flex:none}
.mono-logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.meter{height:6px;border-radius:6px;background:var(--hover);overflow:hidden}
.meter span{display:block;height:100%;background:var(--acc);border-radius:6px}
.orb{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#9AD3FF 32%,#3A6DFF 70%,#1B1F6B);box-shadow:0 0 14px rgba(120,170,255,.55)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--acc);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.okdot{width:16px;height:16px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.okdot svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4}
.empty{padding:28px;text-align:center;color:var(--text-2)}
.empty .ic-box{margin:0 auto 10px;width:40px;height:40px}
h2.pt{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
.ps{color:var(--text-2);margin:2px 0 0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-7-5{grid-template-columns:7fr 5fr}
.lbl{font-size:12px;font-weight:600;color:var(--text-2);margin:18px 0 8px;text-transform:none}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.kv span:first-child{color:var(--text-2)}
.stat .v{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--text-3)}
.tier{border:1px solid var(--line);border-radius:var(--r-card);padding:14px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px}
.tier[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.tier .nm{font-weight:600}
.tier .d{font-size:12.5px;color:var(--text-2)}
.bars{display:flex;gap:2px}
.bars i{width:14px;height:5px;border-radius:3px;background:var(--line-2)}
.bars i.on{background:var(--text)}
.note{font-size:12.5px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt-note{border:1px dashed var(--acc);background:var(--acc-soft);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}

/* ═════════════════════ Control Center window ═════════════════════ */
.win{border-radius:var(--r-win);overflow:hidden;background:var(--win);border:1px solid var(--line-2);box-shadow:0 30px 70px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;height:760px}
.titlebar{height:36px;display:flex;align-items:center;justify-content:space-between;padding-left:12px;font-size:12px;color:var(--text-2);flex:none;-webkit-user-select:none;user-select:none}
.titlebar .tl{display:flex;align-items:center;gap:8px}
.titlebar .wctl{display:flex;height:100%}
.titlebar .wctl span{width:46px;display:grid;place-items:center;font-size:11px;color:var(--text-2)}
.titlebar .wctl span:hover{background:var(--hover)}
.titlebar .wctl span:last-child:hover{background:#C42B1C;color:#fff}
.body{flex:1;display:flex;min-height:0}
.nav{width:232px;flex:none;padding:6px 10px 12px;display:flex;flex-direction:column;gap:1px;overflow:auto;background:var(--side)}
.nav .srch{margin:4px 2px 10px}
.nav .grp{font-size:11.5px;font-weight:600;color:var(--text-3);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:13px;cursor:pointer;position:relative}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.nav a.on::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--acc)}
.nav a .badge{margin-left:auto;font-size:11px;color:var(--text-3)}
.nav .foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.nav .foot .st{font-size:12px;color:var(--text-2);line-height:1.3}
.content{flex:1;min-width:0;overflow:auto;padding:22px 26px 40px;background:var(--win)}
/* layout: rail */
[data-layout="rail"] .nav{width:64px;align-items:center;padding:6px 8px}
[data-layout="rail"] .nav .srch,[data-layout="rail"] .nav .grp,[data-layout="rail"] .nav a span.txt,[data-layout="rail"] .nav a .badge,[data-layout="rail"] .nav .foot .st{display:none}
[data-layout="rail"] .nav a{width:44px;justify-content:center;padding:0}
[data-layout="rail"] .nav .grp + a{margin-top:10px}
/* layout: tabs */
.topnav{display:none}
[data-layout="tabs"] .nav{display:none}
[data-layout="tabs"] .body{flex-direction:column}
[data-layout="tabs"] .topnav{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow:auto;flex:none;background:var(--side)}
.topnav a{padding:10px 12px;font-size:13px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.topnav a.on{color:var(--text);border-color:var(--acc)}
.topnav .more{margin-left:auto}

/* chat */
.chatwrap{display:grid;grid-template-columns:220px 1fr;gap:0;height:100%;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--panel)}
.threads{border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--panel-2)}
.threads a{padding:8px 10px;border-radius:8px;cursor:pointer}
.threads a.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.threads a b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.threads a small{color:var(--text-3);font-size:11.5px}
.conv{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.m-you{align-self:flex-end;max-width:70%;background:var(--ink);color:var(--ink-fg);padding:9px 14px;border-radius:18px 18px 6px 18px}
.m-k{max-width:78%;display:flex;gap:10px}
.m-k .orb{width:22px;height:22px;flex:none;margin-top:2px}
.m-k .bub p{margin:0 0 6px}
.toolrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2);padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin:4px 0}
.composer{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
.composer .input{flex:1;height:38px;border-radius:999px}
.meta-line{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}

/* routine builder */
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--text-3);width:18px}
.connector{height:14px;width:2px;background:var(--line-2);margin-left:21px}
/* usage chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.chart .b i{display:block;border-radius:3px 3px 0 0;background:var(--acc)}
.chart .b i.s2{background:color-mix(in srgb,var(--acc) 45%,transparent);border-radius:0}
.chart .b span{font-size:10px;color:var(--text-3);text-align:center;font-family:var(--mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* home minimal */
.hero-min{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 0 20px}
.hero-min .orb{width:88px;height:88px;margin-bottom:18px}
.hero-min h2{font-family:var(--disp);font-size:28px;font-weight:600;margin:0}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.scrim.on{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--win);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal .mh{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .mh h3{margin:0;font-family:var(--disp);font-size:18px}
.modal .mb{padding:14px 20px}
.modal .mf{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);background:var(--side)}
.quality{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.recs{display:flex;gap:8px}
.recs span{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--text-3);font-size:12px}
.recs span.done{border:0;background:var(--ok);color:#fff}

/* ═════════════════════ Desktop stage + Island ═════════════════════ */
.stage{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;isolation:isolate;container-type:inline-size;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.stage .wall{position:absolute;inset:0;z-index:-2}
[data-theme="light"] .stage .wall{background:radial-gradient(60% 80% at 78% 30%,#CBD9E6,transparent 60%),radial-gradient(70% 70% at 10% 90%,#E8D9C8,transparent 60%),linear-gradient(160deg,#EEF1F4,#DCE3EA 55%,#E9E2D9)}
[data-theme="dark"] .stage .wall{background:radial-gradient(60% 80% at 78% 25%,#2A3A4E,transparent 60%),radial-gradient(70% 70% at 10% 95%,#3A2E27,transparent 60%),linear-gradient(160deg,#15181D,#1B2129 55%,#1E1A17)}
.dapp{position:absolute;left:9%;top:9%;width:62%;height:72%;border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--line),0 18px 50px -18px rgba(0,0,0,.35)}
.dapp .tb{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2)}
.dapp .tb i{height:22px;width:140px;border-radius:7px 7px 0 0;background:var(--panel-2);display:block}
.dapp .dc{padding:3cqw 5cqw}
.dapp .dc h4{font-family:var(--disp);font-size:max(14px,2cqw);margin:0 0 .8cqw}
.dapp .dc p{margin:0 0 1cqw;font-size:max(10px,1.15cqw);color:var(--text-2);line-height:1.6}
.dtask{position:absolute;left:0;right:0;bottom:0;height:5.6%;display:flex;align-items:center;justify-content:center;gap:.8cqw;backdrop-filter:blur(20px);background:color-mix(in srgb,var(--panel) 82%,transparent);border-top:1px solid var(--line)}
.dtask i{width:2.1cqw;height:2.1cqw;border-radius:.45cqw;background:var(--line-2)}
.dtask .ck{position:absolute;right:1.2cqw;font-size:max(9px,.9cqw);text-align:right;line-height:1.2;color:var(--text-2)}
.dtask .trayk{position:absolute;right:6.2cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#000;display:grid;place-items:center}
.dtask .trayk::after{content:"";width:45%;height:45%;border-radius:50%;background:#7FB2FF}
.glowedge{position:absolute;inset:0;pointer-events:none;border-radius:12px;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .5s}
.glowedge.on{box-shadow:inset 0 0 0 2px rgba(140,190,255,.8),inset 0 0 50px rgba(120,170,255,.35)}

.island{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--island);color:var(--island-fg);border-radius:22px;width:0;height:36px;overflow:hidden;opacity:0;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 14px 34px -12px rgba(0,0,0,.65);transition:width .55s var(--spring),height .55s var(--spring),border-radius .45s var(--out),opacity .18s,top .4s var(--out);z-index:5}
.island.show{opacity:1}
.island.bottom{top:auto;bottom:calc(5.6% + 12px)}
.island .irow{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px 0 10px;white-space:nowrap}
.island .orb{width:18px;height:18px;flex:none}
.island .il{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.island .il small{font-weight:400;color:var(--island-fg2);margin-left:6px}
.island canvas{width:46px;height:18px;flex:none}
.island .ibody{padding:0 16px 16px;font-size:14px;line-height:1.45;opacity:0;transition:opacity .2s .12s}
.island.tall .ibody{opacity:1}
.island .ibody .q{color:var(--island-fg2)}
.island .ibody .a{margin-top:8px}
.island .ibody .isteps{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--island-fg2)}
.island .ibody .isteps div{display:flex;gap:8px;align-items:center}
.island .ibody .isteps b{color:#fff;font-weight:600}
.island .ibtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.island .ibtns span{background:#1F1F1F;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.island .ibtns span.p{background:#fff;color:#000;font-weight:600}
.island .ibtns span.d{color:#FF8A80}
.island .warnbar{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:600;color:#FFD27A;letter-spacing:.02em;margin-bottom:6px}
.island .prog{height:3px;border-radius:3px;background:#2A2A2A;overflow:hidden;width:70px;flex:none}
.island .prog span{display:block;height:100%;background:#7FB2FF}
.island .ispin{width:14px;height:14px;border-radius:50%;border:2px solid #333;border-top-color:#7FB2FF;animation:spin .8s linear infinite;flex:none}
.island .ok{width:14px;height:14px;border-radius:50%;background:#3CC98E;flex:none}
.island .inp{margin-top:12px;display:flex;align-items:center;gap:8px;background:#161616;border-radius:999px;padding:7px 12px;color:var(--island-fg2);font-size:13px}
.cubanner{position:absolute;left:50%;bottom:calc(5.6% + 10px);transform:translateX(-50%);background:#000;color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;display:none;gap:10px;align-items:center;box-shadow:0 0 0 2px #E2572F}
.cuframe{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px #E2572F;border-radius:12px;display:none}
.stage.cu .cubanner{display:flex}.stage.cu .cuframe{display:block}
.ctrlbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0}
.ctrlbar .sep{width:1px;height:20px;background:var(--line-2);margin:0 6px}
.ctrlbar .chip{cursor:pointer;height:28px;padding:0 11px;font-size:12.5px;border:1px solid var(--line)}
.ctrlbar .chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:22px}
.sheet .cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sheet .cell .cap{font-size:12px;color:var(--text-2);text-align:center}
.sheet .isl{position:static;transform:none;opacity:1;width:auto;height:auto;max-width:100%}

/* ═════════════════════ Onboarding ═════════════════════ */
.onb{display:grid;grid-template-columns:230px 1fr;height:640px;border-radius:var(--r-win);overflow:hidden;border:1px solid var(--line-2);background:var(--win);box-shadow:0 30px 70px -30px rgba(0,0,0,.45)}
.onb .steps{background:var(--side);padding:22px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.onb .steps .s{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;font-size:13px;color:var(--text-3);cursor:pointer}
.onb .steps .s .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10.5px;font-family:var(--mono)}
.onb .steps .s.done{color:var(--text-2)}
.onb .steps .s.done .n{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.onb .steps .s.on{color:var(--text);background:var(--panel);font-weight:500}
.onb .steps .s.on .n{border-color:var(--acc);color:var(--acc)}
.onb .main{display:flex;flex-direction:column;min-width:0}
.onb .oc{flex:1;overflow:auto;padding:40px 48px}
.onb .oc h2{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.onb .oc .sub{color:var(--text-2);margin:0 0 24px;max-width:560px}
.onb .of{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--line);background:var(--side)}
.levelm{display:flex;gap:3px;align-items:flex-end;height:28px}
.levelm i{width:6px;border-radius:2px;background:var(--acc)}
.phrase{font-family:var(--disp);font-size:22px;font-weight:600;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center;margin:10px 0}

/* ═════════════════════ System surfaces ═════════════════════ */
.traymenu{width:260px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:4px;box-shadow:var(--shadow);font-size:13px}
.traymenu .mi{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px}
.traymenu .mi:hover{background:var(--hover)}
.traymenu .mi .k{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.traymenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{width:360px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:14px;font-size:13px}
.toast .th{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.toast .th .ik{width:16px;height:16px;border-radius:4px;background:#000;display:grid;place-items:center}
.toast .th .ik::after{content:"";width:6px;height:6px;border-radius:50%;background:#7FB2FF}
.toast b{display:block;margin-bottom:2px}
.toast .ta{display:flex;gap:8px;margin-top:12px}
.toast .ta .btn{flex:1;justify-content:center;border-radius:6px}
.hello{width:360px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:20px;text-align:center}
.hello .face{width:56px;height:56px;border-radius:50%;margin:8px auto 12px;border:2px solid var(--acc);display:grid;place-items:center;color:var(--acc)}
.surf{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.surf .cell{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.surf .cap{font-size:12px;font-weight:600;color:var(--text-2)}

/* ═════════════════════ Component gallery ═════════════════════ */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gal .card .cb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gal .spec{font-family:var(--mono);font-size:11px;color:var(--text-3);padding:8px var(--pad);border-top:1px solid var(--line)}
.tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tok{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
.tok i{display:block;height:44px}
.tok div{padding:6px 8px}
.tok small{display:block;font-family:var(--mono);color:var(--text-3);font-size:10.5px}

/* ═════════════════════ Fixes: wrapping, no overlap ═════════════════════ */
.row .trail{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:62%}
.row .grow .t1,.row .grow .t2{overflow-wrap:anywhere}
.card .ch{flex-wrap:wrap}
.phead > div:last-child{justify-content:flex-end}
.content{scrollbar-gutter:stable}
.lbl:first-child{margin-top:0}
[data-theme="light"] .stage-wall{background:radial-gradient(60% 80% at 78% 30%,#CBD9E6,transparent 60%),radial-gradient(70% 70% at 10% 90%,#E8D9C8,transparent 60%),linear-gradient(160deg,#EEF1F4,#DCE3EA 55%,#E9E2D9)}
[data-theme="dark"] .stage-wall{background:radial-gradient(60% 80% at 78% 25%,#2A3A4E,transparent 60%),radial-gradient(70% 70% at 10% 95%,#3A2E27,transparent 60%),linear-gradient(160deg,#15181D,#1B2129 55%,#1E1A17)}

/* ═════════════════════ Added components ═════════════════════ */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.alert .ai{width:18px;height:18px;flex:none;margin-top:1px}
.alert.info{border-color:color-mix(in srgb,var(--acc) 35%,transparent);background:var(--acc-soft)}.alert.info .ai{color:var(--acc)}
.alert.ok{border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}.alert.ok .ai{color:var(--ok)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}.alert.warn .ai{color:var(--warn)}
.alert.err{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}.alert.err .ai{color:var(--danger)}
.alert b{display:block}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--panel);flex:none}
.chk.on i{background:var(--acc);border-color:transparent}
.chk.on i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.rad{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.rad i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--panel)}
.rad.on i{border-color:var(--acc)}.rad.on i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.select{height:34px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--panel);padding:0 10px;display:inline-flex;align-items:center;gap:8px;min-width:180px;justify-content:space-between;font-size:13px}
.select svg:last-child{transform:rotate(90deg);color:var(--text-3)}
input[type=range].rng{width:100%;accent-color:var(--acc)}
.hotkey{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;border:1px dashed var(--line-2);border-radius:var(--r-ctl);background:var(--panel)}
.hotkey.rec{border-style:solid;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);padding-right:10px}
.hotkey .ph{font-size:12.5px;color:var(--acc)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:0;padding:0;position:relative;box-shadow:0 0 0 1px var(--line-2) inset}
.swatches button[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--text)}
.swatches .custom{background:conic-gradient(#f44,#fd4,#4f8,#4df,#66f,#f4d,#f44)}
.recbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;position:relative;flex:none}
.recbtn svg{width:24px;height:24px}
.recbtn.live{background:var(--danger);color:#fff}
.recbtn.live::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--danger);opacity:.5;animation:pulse 1.4s var(--out) infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.lvl{display:flex;gap:3px;align-items:center;height:32px}
.lvl i{width:4px;border-radius:2px;background:var(--acc);height:6px;animation:lv 1s ease-in-out infinite}
@keyframes lv{50%{height:26px}}
.validator{display:flex;gap:3px}
.validator i{flex:1;height:6px;border-radius:3px;background:var(--line-2)}
.validator.good i{background:var(--ok)}.validator.fair i:nth-child(-n+2){background:var(--warn)}.validator.risky i:first-child{background:var(--danger)}
.budget{position:relative;height:8px;border-radius:8px;background:var(--hover)}
.budget span{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--acc)}
.budget em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-3);border-radius:2px}
.skel{border-radius:6px;background:linear-gradient(90deg,var(--hover),var(--panel-2),var(--hover));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.tip{position:relative;display:inline-block;margin-top:34px}
.tip .tt{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap}
.tip .tt::after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}
.menu{width:220px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:4px;box-shadow:var(--shadow);font-size:13px}
.menu .mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:6px}
.menu .mi:hover{background:var(--hover)}
.menu .mi .k{margin-left:auto;font-size:11px;color:var(--text-3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.palette{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--text-3)}
.palette .pin input{border:0;outline:0;background:transparent;flex:1;color:var(--text);font-size:15px;min-width:0}
.palette .pg{font-size:11.5px;font-weight:600;color:var(--text-3);padding:8px 14px 4px}
.palette .pi{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px}
.palette .pi.sel{background:var(--acc-soft)}
.palette .pi .k{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.sheetpanel{width:100%;background:var(--win);border:1px solid var(--line-2);border-radius:12px 0 0 12px;box-shadow:var(--shadow);padding:16px}
.qr{width:120px;height:120px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:10px;display:grid;grid-template-columns:repeat(9,1fr);gap:2px;flex:none}
.qr i{background:var(--text);border-radius:1.5px}.qr i.o{background:transparent}
.scope{display:flex;flex-wrap:wrap;gap:6px}
.scope button{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-size:12px}
.scope button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.orbstate{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2)}
.orbstate .o{width:28px;height:28px;border-radius:50%;background:#000;display:grid;place-items:center}
.orbstate .o::after{content:"";width:12px;height:12px;border-radius:50%;background:#7FB2FF}
.orbstate .o.listen::after{background:#fff;box-shadow:0 0 10px #fff}
.orbstate .o.think::after{background:conic-gradient(#7FB2FF,transparent);animation:spin 1s linear infinite}
.orbstate .o.speak::after{background:#9AD3FF;animation:breathe2 1s ease-in-out infinite}
.orbstate .o.err::after{background:#F06A61}
.orbstate .o.pause::after{background:#777}
@keyframes breathe2{50%{transform:scale(1.25)}}
.gsec{font-family:var(--disp);font-size:17px;font-weight:600;margin:30px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gsec small{font-family:var(--sys);font-size:12.5px;font-weight:400;color:var(--text-3)}
.dl{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);width:100%}
.provrow{display:flex;gap:10px;align-items:center;width:100%;padding:8px 0;border-top:1px solid var(--line)}
.provrow:first-child{border-top:0}
.useind{display:inline-flex;gap:4px;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:#000;color:#fff;font-size:11.5px;white-space:nowrap}
.useind svg{width:13px;height:13px}
.tray-mini{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--text-2)}
.tray-mini .k{width:18px;height:18px;border-radius:50%;background:#000;display:grid;place-items:center;flex:none}
.tray-mini .k::after{content:"";width:8px;height:8px;border-radius:50%;background:#7FB2FF}

/* ═════════════════════ Onboarding v2 ═════════════════════ */
.ob{border-radius:var(--r-win);overflow:hidden;border:1px solid var(--line-2);background:var(--win);box-shadow:0 30px 70px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;height:760px}
.ob .prog{display:flex;gap:6px;padding:14px 28px 0}
.ob .prog .ph{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--text-3);font-weight:500}
.ob .prog .ph i{height:4px;border-radius:4px;background:var(--hover);overflow:hidden;display:block}
.ob .prog .ph i b{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .4s var(--out)}
.ob .prog .ph.on{color:var(--text)}
.ob .stage2{flex:1;overflow:auto;display:flex;justify-content:center;padding:32px 28px 24px}
.ob .col{width:100%;max-width:600px;display:flex;flex-direction:column}
.ob .eyebrow{font-size:12px;font-weight:600;color:var(--acc);margin-bottom:8px}
.ob h2{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15}
.ob .sub{color:var(--text-2);margin:0 0 24px;font-size:15px;line-height:1.5}
.ob .foot{display:flex;align-items:center;gap:10px;padding:14px 28px;border-top:1px solid var(--line)}
.ob .foot .sp{flex:1}
.ob .choice{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);width:100%;transition:border-color .15s,box-shadow .15s}
.ob .choice + .choice{margin-top:8px}
.ob .choice[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ob .choice .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:2px;display:grid;place-items:center}
.ob .choice[aria-pressed="true"] .rd{border-color:var(--acc)}
.ob .choice[aria-pressed="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.ob .choice .ct{flex:1;min-width:0}
.ob .choice .ct b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ob .choice .ct span{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.ob .choice .ct b .chip{margin:0}
.ob .promise{display:flex;flex-direction:column;gap:14px;margin:4px 0 0}
.ob .promise > div{display:flex;gap:12px;align-items:flex-start}
.ob .promise b{display:block}
.ob .promise span:not(.ic-box){font-size:13.5px;color:var(--text-2)}

let amp = 0, t = 0, raf = null;
const loud = () => ['listening','speaking','media'].includes(OV.state);
const tick = () => {
  t += 1/60; const target = loud() ? .35 + .65*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.7+1) + .25*Math.sin(t*9)) : 0;
  amp += (target - amp) * .12;
  const c = document.getElementById('ovWave');
  if (c) { const x = c.getContext('2d'); x.clearRect(0,0,c.width,c.height);
    for (let i=0;i<5;i++){ const h = 6 + (c.height-8)*Math.max(.08, amp*(.5+.5*Math.abs(Math.sin(t*6+i*1.3))));
      x.fillStyle = OV.state==='speaking' ? '#9AD3FF' : '#fff'; x.beginPath(); x.roundRect(6+i*17,(c.height-h)/2,8,h,4); x.fill(); } }
  if (S.sec !== 'overlay' || (!loud() && amp < .003)) { raf = null; return; }   // zero frames at rest
  raf = requestAnimationFrame(tick);
};
const kick = () => { if (!raf && !matchMedia('(prefers-reduced-motion: reduce)').matches) raf = requestAnimationFrame(tick); };

    ${c('Provider states', `<div style="width:100%">${[['CC','#C96442','Claude Code','Ready',chip('<span class="dotc"></span>Ready','local')],['CX','#10A37F','Codex','Signing in…','<span class="spin"></span>'],['GC','#4285F4','Gemini CLI','Signed out',`<button class="btn sm ink">Sign in</button>`],['OR','#4B4BD6','OpenRouter','Rate limited · retry in 20 s',chip('Busy','costly')]].map(([m,co,n,d,r])=>`<div class="provrow">${logo(m,co)}<div style="flex:1"><b>${n}</b><div style="font-size:12px;color:var(--text-2)">${d}</div></div>${r}</div>`).join('')}</div>`, 'custom')}
    ${c('Routing reason', `<div style="display:flex;flex-direction:column;gap:6px;width:100%">${chip('Coding · Claude Code','cloud')}<div class="meta-line">Used Coding profile because this looked like a software task. Private files were excluded.</div></div>`, 'custom · plan §145 explainability')}
  </div>

  ${sec('Control & data','capabilities, permissions, routines, connectors, memory')}
  <div class="gal">
    ${c('Capability row', `<div class="rows" style="width:100%;margin:-16px">${row(icb('hand'),'Computer use','AI uses your mouse and keyboard. Last resort', chip('Cloud','cloud')+chip('Costly','costly')+tog(false,'Computer use'))}${row(icb('eye'),'Screen awareness','Used 3 min ago', `<span class="useind">${I('eye')}In use</span>` + tog(true,'Screen'))}</div>`, 'custom')}
    ${c('Grant row', `<div class="rows" style="width:100%;margin:-16px">${row(icb('term'),'Run cargo commands','D:\\work\\kivo · always', `<button class="btn sm">Revoke</button>`)}</div>`, 'custom')}
    ${c('Audit row', `<div class="rows" style="width:100%;margin:-16px">${row(`<span class="meta">08:47</span>`,'Send email to x@unknown.io','Denied: the address came from a web page (untrusted)', chip('Denied','bad'))}</div>`, 'custom · provenance shown')}
    ${c('Routine steps', `<div style="width:100%"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${chip('“work mode”')}${chip('Ctrl+Alt+W')}${chip('Weekdays 9:00')}</div><div class="step"><span class="n">1</span>${I('grip')}${I('window')}<div style="flex:1">Open <b>VS Code</b></div>${chip('Low','local')}</div><div class="connector"></div><div class="step"><span class="n">2</span>${I('grip')}${I('sparkle')}<div style="flex:1">Ask AI: summarize unread mail</div>${chip('AI · $','costly')}</div></div>`, 'custom · drag to reorder')}
    ${c('Connector tile', `<div style="width:100%;display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:10px;align-items:center">${logo('GC','#1A73E8')}<div style="flex:1"><b>Google Calendar</b><div style="font-size:12px;color:var(--text-2)">Sign in with Google · no keys</div></div><button class="btn sm ink">Connect</button></div><div style="display:flex;gap:10px;align-items:center">${logo('GH','#24292F')}<div style="flex:1"><b>GitHub</b><div style="font-size:12px;color:var(--text-2)">Connected as MadBlast0</div></div>${chip('<span class="dotc"></span>Connected','local')}</div></div>`, 'custom')}
    ${c('Memory item', `<div class="rows" style="width:100%;margin:-16px">${row(icb('lock'),'Maya’s birthday is 12 March','Personal · never sent to cloud AI', chip('Sensitive','sens') + `<button class="btn sm ghost" aria-label="Edit">${I('edit')}</button>`)}</div>`, 'custom')}
    ${c('Plugin / connector consent', `<div style="width:100%"><b>“Recipe Helper” wants to:</b><div style="display:flex;flex-direction:column;gap:6px;margin:8px 0;font-size:13px">${[['globe','Access api.recipes.com'],['folder','Read Documents\\Recipes'],['plus','Add 2 tools (Low risk)']].map(([i,t])=>`<div style="display:flex;gap:8px;align-items:center">${I(i)}${t}</div>`).join('')}</div><div style="display:flex;gap:6px"><button class="btn sm ink">Allow and install</button><button class="btn sm">Cancel</button></div></div>`, 'custom · like mobile app permissions')}
    ${c('Phone pairing', `<div style="display:flex;gap:14px;align-items:center">${qr()}<div><b>Pair your phone</b><div style="font-size:12.5px;color:var(--text-2)">Scan with the KIVO app. Single-use code, expires in 1:48. End-to-end encrypted.</div></div></div>`, 'custom · post-MVP (KIVO Remote)')}
  </div>

  ${sec('Overlays','dialogs, sheets, menus, toasts')}
  <div class="gal">
    ${c('Dialog', `<button class="btn" data-modal="wake">Open “Add wake word”</button><button class="btn" data-modal="routine">Open “New routine”</button>`, 'Base UI Dialog')}
    ${c('Side sheet', `<div class="sheetpanel"><div style="display:flex;justify-content:space-between;align-items:center"><b>Claude Code</b><button class="btn icon ghost" aria-label="Close">${I('x')}</button></div><div class="kv"><span>Account</span><span>signed in</span></div><div class="kv"><span>Used by profiles</span><span>Default, Coding</span></div><div class="kv"><span>This month</span><span>$1.12</span></div></div>`, 'Base UI Dialog as a sheet · details without leaving the page')}
    ${c('Context menu', `<div class="menu"><div class="mi">${I('play')}Run now</div><div class="mi">${I('edit')}Edit<span class="k">Enter</span></div><div class="mi">${I('link')}Duplicate</div><hr><div class="mi" style="color:var(--danger)">${I('trash')}Delete<span class="k">Del</span></div></div>`, 'Base UI Menu')}
    ${c('Toast', `<div class="toast" style="width:100%"><div class="th"><span class="ik"></span>KIVO</div><b>Tests fixed</b>All 48 tests pass.<div class="ta"><button class="btn">View</button><button class="btn">Dismiss</button></div></div>`, 'Windows toast (system) · in-app toast for Control Center')}
  </div>`;
};

/* ═════════════════════ Modals ═════════════════════ */
const MODALS = {
  wake: () => `<div class="mh"><div><h3>Add a wake word</h3><div style="color:var(--text-2);font-size:13px">Type it, check it, record it: done in about a minute.</div></div><button class="btn icon ghost" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb"><div class="lbl" style="margin-top:0">Phrase</div><div class="input">${I('mic')}<input value="Okay Jarvis"></div>
    <div class="quality" style="margin-top:10px"><span class="okdot">${I('check')}</span><div style="flex:1"><b>Good choice</b><div style="font-size:12.5px;color:var(--text-2)">4 syllables · distinctive sounds · no clash with commands or other wake words</div></div><button class="btn sm">${I('play')}Hear it</button></div>
    <div class="lbl">Record 5 samples <span style="font-weight:400;color:var(--text-3)">(it already works without them, and they make it more accurate)</span></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="recs">${[1,2,3,4,5].map(i=>`<span class="${i<3?'done':''}">${i<3?'✓':i}</span>`).join('')}</div><button class="btn ink">${I('mic')}Record 3</button></div>
    <div class="lbl">Sensitivity</div><input type="range" min="0" max="100" value="50" style="width:100%;accent-color:var(--acc)" aria-label="Sensitivity"><div class="kv" style="font-size:12px"><span>Fewer false wakes</span><span>Wakes more easily</span></div>
    <div class="note" style="margin-top:10px">False-wake test on 10 minutes of background speech: <b>0 false wakes</b> ✓</div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn ink" data-close>Add wake word</button></div>`,
  routine: () => `<div class="mh"><div><h3>New routine</h3><div style="color:var(--text-2);font-size:13px">Start from a template, or describe it.</div></div><button class="btn icon ghost" data-close aria-label="Close">${I('x')}</button></div>
    <div class="mb"><div class="input">${I('sparkle')}<input value="When I say work mode, open VS Code and Slack and turn on Focus"></div>
    <div style="font-size:12px;color:var(--text-3);margin:6px 0 14px">KIVO drafts the steps. You review them before saving.</div>
    <div class="lbl" style="margin-top:0">Or start from</div><div class="grid g2">${[['Work mode','Open apps + Focus'],['Focus timer','Timer + Do Not Disturb'],['Meeting','Mute, headset, calendar link'],['Goodnight','Close apps, sleep (asks)']].map(([a,b]) => `<button class="tier" aria-pressed="false" data-act="tier"><span class="nm">${a}</span><span class="d">${b}</span></button>`).join('')}</div></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn ink" data-close>Continue</button></div>`
};

/* ═════════════════════ Render + events ═════════════════════ */
const page = document.getElementById('page');
const render = () => {
  applyRoot(); save();
  document.querySelectorAll('#secTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.sec === S.sec));
  document.querySelectorAll('#oAccent button').forEach(b => b.setAttribute('aria-pressed', b.dataset.acc === S.accent));
  ['oTheme','oLayout','oHome','oDensity'].forEach((id,i) => document.getElementById(id).value = [S.theme,S.layout,S.home,S.density][i]);
  page.innerHTML = { overlay:overlayHTML, cc:ccHTML, onb:onbHTML, sys:sysHTML, comp:compHTML }[S.sec]();
  const isl = document.getElementById('ovIsland'); if (isl) { renderIsland(isl, OV, 'ovWave'); kick(); }
  document.querySelectorAll('[data-sheet]').forEach(el => renderIsland(el, { state: el.dataset.sheet, partial: el.dataset.sheet==='listening' ? 'Play something calm on Spotify' : '' }));
};
const ovSet = (state, partial) => { OV.state = state; if (partial !== undefined) OV.partial = partial; else if (state==='listening') OV.partial = 'Play something calm on Spotify and';
  const isl = document.getElementById('ovIsland'); if (!isl) return; renderIsland(isl, OV, 'ovWave');
  document.querySelectorAll('[data-ov]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ov === state)); kick(); };
let timers = []; const stopT = () => { timers.forEach(clearTimeout); timers = []; }; const at = (ms, fn) => timers.push(setTimeout(fn, ms));
const playReq = () => {
  stopT(); ovSet('idle');
  if (OV.glow) { at(120, () => { const g = document.getElementById('glow'); g && g.classList.add('on'); }); at(650, () => { const g = document.getElementById('glow'); g && g.classList.remove('on'); }); }
  at(250, () => ovSet('listening',''));
  const w = REQ.split(' '); let acc = ''; w.forEach((x,i) => at(700 + i*220, () => { acc += (i?' ':'') + x; ovSet('listening', acc); }));
  let T = 700 + w.length*220 + 350;
  at(T, () => ovSet('thinking')); at(T += 900, () => ovSet('acting')); at(T += 1500, () => ovSet('speaking')); at(T += 3200, () => ovSet('media')); at(T += 3500, () => ovSet('idle'));
};

document.addEventListener('click', e => {
  const el = e.target.closest('button,a,[data-onb]'); if (!el) return;
  const d = el.dataset;
  if (d.sec) { stopT(); S.sec = d.sec; render(); window.scrollTo(0,0); return; }
  if (d.acc) { S.accent = d.acc; render(); return; }
  if (d.go) { S.sec = 'cc'; S.page = d.go; render(); return; }
  if (d.ov) { stopT(); ovSet(d.ov); return; }
  if (d.ovopt) { if (d.ovopt==='pos') OV.pos = OV.pos==='top'?'bottom':'top'; else OV[d.ovopt] = !OV[d.ovopt]; render(); if (d.ovopt==='glow' && OV.glow) playReq(); return; }
  if (el.id === 'ovPlay') { playReq(); return; }
  if (d.onb !== undefined) { S.onb = +d.onb; render(); return; }
  if (d.onbnav) { S.onb = Math.max(0, Math.min(ONB.length-1, S.onb + +d.onbnav)); render(); return; }
  if (d.modal) { document.getElementById('modal').innerHTML = MODALS[d.modal](); document.getElementById('scrim').classList.add('on'); return; }
  if (d.close !== undefined) { document.getElementById('scrim').classList.remove('on'); return; }
  if (d.set) { S[d.set] = d.val; render(); return; }
  if (d.obtry !== undefined) { playMini(); return; }
  if (d.act === 'choice') { el.parentElement.querySelectorAll('.choice').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (d.act === 'tog') { el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); return; }
  if (d.act === 'seg') { el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
  if (d.act === 'tier') { el.parentElement.querySelectorAll('.tier').forEach(b => b.setAttribute('aria-pressed', b === el)); return; }
});
document.getElementById('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') e.currentTarget.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('scrim').classList.remove('on');
  if (e.key === 'Enter' && e.target.matches('.nav a')) e.target.click(); });
[['oTheme','theme'],['oLayout','layout'],['oHome','home'],['oDensity','density']].forEach(([id,k]) => document.getElementById(id).addEventListener('change', e => { S[k] = e.target.value; if (k==='home') { S.sec='cc'; S.page='home'; } if (k==='layout') S.sec='cc'; render(); }));
render();
})();
</script>
</body>
</html>
